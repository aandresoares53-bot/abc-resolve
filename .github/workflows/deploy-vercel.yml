name: Deploy pgen to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'pgen/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (production)
        run: |
          vercel deploy --prod --yes \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=team_u64BjXky8gU7awucrRya9S8i
        working-directory: ./pgen
        env:
          VERCEL_ORG_ID: team_u64BjXky8gU7awucrRya9S8i
          VERCEL_PROJECT_ID: prj_WHTDsRieojzMcAssTuCwRbzWNtlq
