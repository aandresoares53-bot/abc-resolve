<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Creator</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface2: #22222e;
      --border: #2e2e40;
      --accent: #7c6af7;
      --accent2: #9d8fff;
      --text: #e8e6f0;
      --text2: #9490b0;
      --danger: #f74c6a;
      --success: #4caf82;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), #c084fc);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
    }

    header h1 { font-size: 1.2rem; font-weight: 600; letter-spacing: -0.02em; }

    header .badge {
      margin-left: 8px;
      background: rgba(124,106,247,0.15);
      border: 1px solid rgba(124,106,247,0.3);
      border-radius: 20px;
      color: var(--accent2);
      font-size: 0.7rem;
      padding: 2px 10px;
      font-weight: 600;
    }

    main {
      display: flex;
      flex: 1;
    }

    .panel-left {
      width: 360px;
      min-width: 300px;
      border-right: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .panel-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 16px;
    }

    label {
      font-size: 0.73rem;
      font-weight: 700;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: block;
      margin-bottom: 7px;
    }

    .api-key-row {
      display: flex;
      gap: 8px;
    }

    .api-key-row input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.85rem;
      padding: 9px 12px;
      font-family: monospace;
      transition: border-color 0.2s;
    }

    .api-key-row input:focus { outline: none; border-color: var(--accent); }

    .btn-sm {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text2);
      font-size: 0.8rem;
      padding: 9px 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn-sm:hover { border-color: var(--accent); color: var(--accent2); }

    textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.9rem;
      line-height: 1.55;
      padding: 11px 13px;
      resize: vertical;
      min-height: 100px;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    textarea:focus { outline: none; border-color: var(--accent); }
    textarea::placeholder { color: var(--text2); }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field { display: flex; flex-direction: column; }

    select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.88rem;
      padding: 9px 12px;
      width: 100%;
      font-family: inherit;
      transition: border-color 0.2s;
      cursor: pointer;
    }

    select:focus { outline: none; border-color: var(--accent); }
    select option { background: var(--surface2); }

    .btn-generate {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--accent), #c084fc);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-generate:hover { opacity: 0.88; }
    .btn-generate:active { transform: scale(0.98); }
    .btn-generate:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    .image-wrap {
      width: 100%;
      max-width: 560px;
      position: relative;
    }

    .image-area {
      width: 100%;
      aspect-ratio: 1;
      background: var(--surface);
      border: 2px dashed var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text2);
      overflow: hidden;
      transition: border-color 0.3s;
      position: relative;
    }

    .image-area.landscape { aspect-ratio: 16/9; }
    .image-area.portrait { aspect-ratio: 9/16; }
    .image-area.generating { border-color: var(--accent); border-style: solid; }

    .image-area img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      border-radius: 14px;
    }

    .placeholder-icon { font-size: 2.5rem; }
    .placeholder-text { font-size: 0.85rem; }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .image-area.generating .spinner { display: block; }
    .image-area.generating .placeholder-icon,
    .image-area.generating .placeholder-text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .image-toolbar {
      display: none;
      gap: 8px;
      margin-top: 12px;
      justify-content: center;
    }

    .image-toolbar.visible { display: flex; }

    .btn-tool {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text2);
      font-size: 0.82rem;
      padding: 8px 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; gap: 6px;
    }

    .btn-tool:hover { border-color: var(--accent); color: var(--accent2); }

    .error-msg {
      background: rgba(247,76,106,0.1);
      border: 1px solid rgba(247,76,106,0.3);
      border-radius: 8px;
      color: #f88;
      font-size: 0.82rem;
      padding: 10px 14px;
      display: none;
      line-height: 1.5;
    }

    .error-msg.visible { display: block; }

    .credits-note {
      font-size: 0.75rem;
      color: var(--text2);
      text-align: center;
    }

    .credits-note a { color: var(--accent2); }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 680px) {
      main { flex-direction: column; }
      .panel-left { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🎨</div>
  <h1>Image Creator</h1>
  <span class="badge">Stability AI</span>
</header>

<main>
  <div class="panel-left">

    <div class="field">
      <label>Chave de API <a href="https://platform.stability.ai/account/keys" target="_blank" style="color:var(--accent2);font-size:0.7rem;text-transform:none;font-weight:400;letter-spacing:0">Obter chave ↗</a></label>
      <div class="api-key-row">
        <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
        <button class="btn-sm" onclick="saveKey()">Salvar</button>
      </div>
    </div>

    <hr class="divider">

    <div class="field">
      <label>Prompt</label>
      <textarea id="prompt" placeholder="Descreva a imagem...&#10;Ex: beautiful woman, sunset beach, golden hour, 8k, photorealistic"></textarea>
    </div>

    <div class="field">
      <label>Prompt Negativo</label>
      <textarea id="negPrompt" style="min-height:70px" placeholder="O que evitar...&#10;Ex: blurry, deformed, ugly, bad anatomy"></textarea>
    </div>

    <div class="settings-grid">
      <div class="field">
        <label>Proporção</label>
        <select id="ratio" onchange="updateRatio()">
          <option value="1024x1024">1:1 Quadrado</option>
          <option value="1344x768">16:9 Paisagem</option>
          <option value="768x1344">9:16 Retrato</option>
          <option value="1216x832">3:2 Foto</option>
          <option value="832x1216">2:3 Foto vert.</option>
        </select>
      </div>
      <div class="field">
        <label>Modelo</label>
        <select id="model">
          <option value="core">SD Core</option>
          <option value="ultra">SD Ultra</option>
        </select>
      </div>
      <div class="field">
        <label>Estilo</label>
        <select id="style">
          <option value="">Nenhum</option>
          <option value="photographic">Fotográfico</option>
          <option value="cinematic">Cinematográfico</option>
          <option value="analog-film">Filme analógico</option>
          <option value="anime">Anime</option>
          <option value="digital-art">Arte digital</option>
          <option value="fantasy-art">Fantasia</option>
          <option value="neon-punk">Neon punk</option>
          <option value="3d-model">3D</option>
          <option value="pixel-art">Pixel art</option>
        </select>
      </div>
      <div class="field">
        <label>Seed</label>
        <div style="display:flex;gap:6px">
          <input type="number" id="seed" value="0" min="0" max="4294967295"
            style="flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.88rem;padding:9px 12px;">
          <button class="btn-sm" onclick="randomSeed()" title="Aleatório">🎲</button>
        </div>
      </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <button class="btn-generate" id="btnGenerate" onclick="generate()">
      <span id="btnIcon">✨</span>
      <span id="btnText">Gerar Imagem</span>
    </button>

    <p class="credits-note">
      Powered by <a href="https://stability.ai" target="_blank">Stability AI</a> · SD Core ~$0.003/imagem · Ultra ~$0.008/imagem
    </p>

  </div>

  <div class="panel-right">
    <div class="image-wrap">
      <div class="image-area" id="imageArea">
        <div class="spinner"></div>
        <div class="placeholder-icon">🖼️</div>
        <div class="placeholder-text">A imagem aparece aqui</div>
      </div>
      <div class="image-toolbar" id="imageToolbar">
        <button class="btn-tool" onclick="downloadImage()">⬇ Salvar PNG</button>
        <button class="btn-tool" onclick="copyPrompt()">📋 Copiar prompt</button>
        <button class="btn-tool" onclick="generateVariation()">🔀 Variação</button>
      </div>
    </div>
  </div>
</main>

<script>
  let lastImageUrl = null;
  let lastPromptUsed = '';
  let generating = false;

  // load saved key
  try {
    const saved = localStorage.getItem('stability_api_key');
    if (saved) document.getElementById('apiKey').value = saved;
  } catch {}

  function saveKey() {
    try {
      localStorage.setItem('stability_api_key', document.getElementById('apiKey').value.trim());
    } catch {}
    const btn = event.target;
    btn.textContent = '✓ Salvo';
    setTimeout(() => btn.textContent = 'Salvar', 1500);
  }

  function randomSeed() {
    document.getElementById('seed').value = Math.floor(Math.random() * 4294967295);
  }

  function updateRatio() {
    const area = document.getElementById('imageArea');
    const val = document.getElementById('ratio').value;
    const [w, h] = val.split('x').map(Number);
    area.className = 'image-area';
    if (w > h) area.classList.add('landscape');
    else if (h > w) area.classList.add('portrait');
    if (area.classList.contains('generating')) area.classList.add('generating');
  }

  async function generate() {
    if (generating) return;

    const apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey) { showError('Cole sua chave de API da Stability AI antes de gerar.'); return; }

    const prompt = document.getElementById('prompt').value.trim();
    if (!prompt) { showError('Digite um prompt antes de gerar.'); return; }

    hideError();
    generating = true;
    lastPromptUsed = prompt;

    const btn = document.getElementById('btnGenerate');
    btn.disabled = true;
    document.getElementById('btnIcon').textContent = '⏳';
    document.getElementById('btnText').textContent = 'Gerando...';

    const area = document.getElementById('imageArea');
    area.classList.add('generating');
    const prev = area.querySelector('img');
    if (prev) prev.remove();
    document.getElementById('imageToolbar').classList.remove('visible');

    const model = document.getElementById('model').value;
    const ratio = document.getElementById('ratio').value;
    const [width, height] = ratio.split('x');
    const style = document.getElementById('style').value;
    const seed = parseInt(document.getElementById('seed').value) || 0;
    const negPrompt = document.getElementById('negPrompt').value.trim();

    const formData = new FormData();
    formData.append('prompt', prompt);
    formData.append('output_format', 'png');
    formData.append('width', width);
    formData.append('height', height);
    formData.append('seed', seed);
    if (negPrompt) formData.append('negative_prompt', negPrompt);
    if (style) formData.append('style_preset', style);

    const endpoint = model === 'ultra'
      ? 'https://api.stability.ai/v2beta/stable-image/generate/ultra'
      : 'https://api.stability.ai/v2beta/stable-image/generate/core';

    try {
      const r = await fetch(endpoint, {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + apiKey,
          'Accept': 'image/*',
        },
        body: formData,
      });

      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        const msg = err?.errors?.[0] || err?.message || `HTTP ${r.status}`;
        if (r.status === 401) throw new Error('Chave de API inválida ou expirada.');
        if (r.status === 402) throw new Error('Créditos insuficientes na conta Stability AI.');
        throw new Error(msg);
      }

      const blob = await r.blob();
      if (lastImageUrl) URL.revokeObjectURL(lastImageUrl);
      lastImageUrl = URL.createObjectURL(blob);

      const img = document.createElement('img');
      img.src = lastImageUrl;
      area.appendChild(img);
      document.getElementById('imageToolbar').classList.add('visible');

      // update seed from response header if available
      const finishReason = r.headers.get('finish-reason');
      const returnedSeed = r.headers.get('seed');
      if (returnedSeed) document.getElementById('seed').value = returnedSeed;

    } catch (e) {
      showError('Erro: ' + e.message);
    } finally {
      area.classList.remove('generating');
      generating = false;
      btn.disabled = false;
      document.getElementById('btnIcon').textContent = '✨';
      document.getElementById('btnText').textContent = 'Gerar Imagem';
    }
  }

  function downloadImage() {
    if (!lastImageUrl) return;
    const a = document.createElement('a');
    a.href = lastImageUrl;
    a.download = 'image-creator-' + Date.now() + '.png';
    a.click();
  }

  function copyPrompt() {
    if (!lastPromptUsed) return;
    navigator.clipboard.writeText(lastPromptUsed).then(() => {
      const btn = event.target;
      btn.textContent = '✓ Copiado';
      setTimeout(() => btn.textContent = '📋 Copiar prompt', 1500);
    });
  }

  function generateVariation() {
    randomSeed();
    generate();
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('visible');
  }

  function hideError() {
    document.getElementById('errorMsg').classList.remove('visible');
  }

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') generate();
  });
</script>

</body>
</html>
