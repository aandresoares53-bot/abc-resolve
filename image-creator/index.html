<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Creator</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface2: #22222e;
      --border: #2e2e40;
      --accent: #7c6af7;
      --accent2: #9d8fff;
      --text: #e8e6f0;
      --text2: #9490b0;
      --danger: #f74c6a;
      --success: #4caf82;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), #c084fc);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
    }

    header .status-dot {
      margin-left: auto;
      display: flex; align-items: center; gap: 8px;
      font-size: 0.8rem;
      color: var(--text2);
    }

    header .status-dot span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.3s;
    }

    header .status-dot.online span { background: var(--success); }
    header .status-dot.offline span { background: var(--danger); }

    main {
      display: flex;
      flex: 1;
      gap: 0;
    }

    .panel-left {
      width: 380px;
      min-width: 320px;
      border-right: 1px solid var(--border);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel-right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: block;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.92rem;
      line-height: 1.5;
      padding: 12px 14px;
      resize: vertical;
      min-height: 110px;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    textarea::placeholder { color: var(--text2); }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    input[type=number], select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      padding: 10px 12px;
      width: 100%;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    input[type=number]:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }

    select option { background: var(--surface2); }

    .url-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .url-row input[type=text] {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.85rem;
      padding: 8px 12px;
      font-family: monospace;
    }

    .url-row input[type=text]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn-ping {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text2);
      font-size: 0.8rem;
      padding: 8px 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn-ping:hover { border-color: var(--accent); color: var(--accent); }

    .btn-generate {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), #c084fc);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: auto;
    }

    .btn-generate:hover { opacity: 0.9; }
    .btn-generate:active { transform: scale(0.98); }
    .btn-generate:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .image-area {
      width: 100%;
      max-width: 600px;
      aspect-ratio: 1;
      background: var(--surface);
      border: 2px dashed var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text2);
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s;
    }

    .image-area.generating { border-color: var(--accent); border-style: solid; }

    .image-area img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      border-radius: 14px;
    }

    .image-area .placeholder-icon { font-size: 3rem; }
    .image-area .placeholder-text { font-size: 0.9rem; }

    .progress-bar-wrap {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 4px;
      background: var(--border);
      display: none;
    }

    .progress-bar-wrap.active { display: block; }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #c084fc);
      width: 0%;
      transition: width 0.3s;
    }

    .image-actions {
      position: absolute;
      top: 12px; right: 12px;
      display: none;
      gap: 8px;
    }

    .image-area:has(img) .image-actions { display: flex; }

    .btn-action {
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #fff;
      font-size: 0.8rem;
      padding: 6px 10px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.2s;
    }

    .btn-action:hover { background: rgba(124,106,247,0.8); }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .image-area.generating .spinner { display: block; }
    .image-area.generating .placeholder-icon,
    .image-area.generating .placeholder-text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      background: rgba(247,76,106,0.1);
      border: 1px solid rgba(247,76,106,0.3);
      border-radius: 8px;
      color: #f47;
      font-size: 0.82rem;
      padding: 10px 14px;
      display: none;
    }

    .error-msg.visible { display: block; }

    .seed-row {
      display: flex; gap: 8px; align-items: flex-end;
    }
    .seed-row .field { flex: 1; }
    .btn-random {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text2);
      padding: 10px 12px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
      margin-bottom: 0;
    }
    .btn-random:hover { border-color: var(--accent); color: var(--accent); }

    @media (max-width: 700px) {
      main { flex-direction: column; }
      .panel-left { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🎨</div>
  <h1>Image Creator</h1>
  <div class="status-dot" id="statusDot">
    <span></span>
    <span id="statusLabel">verificando...</span>
  </div>
</header>

<main>
  <div class="panel-left">

    <div class="field">
      <label>Servidor AUTOMATIC1111</label>
      <div class="url-row">
        <input type="text" id="serverUrl" value="http://localhost:7860" placeholder="http://localhost:7860">
        <button class="btn-ping" onclick="ping()">Testar</button>
      </div>
    </div>

    <div class="field">
      <label>Prompt</label>
      <textarea id="prompt" placeholder="Descreva a imagem que quer gerar...&#10;Ex: beautiful woman, beach sunset, golden hour, 8k"></textarea>
    </div>

    <div class="field">
      <label>Prompt Negativo</label>
      <textarea id="negPrompt" style="min-height:70px" placeholder="O que evitar...&#10;Ex: blurry, bad anatomy, deformed"></textarea>
    </div>

    <div class="settings-grid">
      <div class="field">
        <label>Largura</label>
        <input type="number" id="width" value="512" min="64" max="2048" step="64">
      </div>
      <div class="field">
        <label>Altura</label>
        <input type="number" id="height" value="512" min="64" max="2048" step="64">
      </div>
      <div class="field">
        <label>Steps</label>
        <input type="number" id="steps" value="20" min="1" max="150">
      </div>
      <div class="field">
        <label>CFG Scale</label>
        <input type="number" id="cfg" value="7" min="1" max="30" step="0.5">
      </div>
    </div>

    <div class="seed-row">
      <div class="field">
        <label>Seed</label>
        <input type="number" id="seed" value="-1" min="-1">
      </div>
      <button class="btn-random" title="Seed aleatório" onclick="document.getElementById('seed').value=-1">🎲</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <button class="btn-generate" id="btnGenerate" onclick="generate()">
      <span id="btnIcon">✨</span>
      <span id="btnText">Gerar Imagem</span>
    </button>

  </div>

  <div class="panel-right">
    <div class="image-area" id="imageArea">
      <div class="spinner"></div>
      <div class="placeholder-icon">🖼️</div>
      <div class="placeholder-text">A imagem aparece aqui</div>
      <div class="progress-bar-wrap" id="progressWrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="image-actions">
        <button class="btn-action" onclick="downloadImage()">⬇ Salvar</button>
        <button class="btn-action" onclick="copyPromptFromMeta()">📋 Copiar prompt</button>
      </div>
    </div>
  </div>
</main>

<script>
  let lastImageB64 = null;
  let lastPromptUsed = '';
  let generating = false;
  let progressInterval = null;

  function getUrl() {
    return document.getElementById('serverUrl').value.replace(/\/$/, '');
  }

  async function ping() {
    const dot = document.getElementById('statusDot');
    const label = document.getElementById('statusLabel');
    dot.className = 'status-dot';
    label.textContent = 'verificando...';
    try {
      const r = await fetch(getUrl() + '/sdapi/v1/sd-models', { signal: AbortSignal.timeout(5000) });
      if (r.ok) {
        dot.className = 'status-dot online';
        label.textContent = 'online';
      } else {
        throw new Error();
      }
    } catch {
      dot.className = 'status-dot offline';
      label.textContent = 'offline';
    }
  }

  async function pollProgress() {
    try {
      const r = await fetch(getUrl() + '/sdapi/v1/progress', { signal: AbortSignal.timeout(3000) });
      if (!r.ok) return;
      const data = await r.json();
      const pct = Math.round((data.progress || 0) * 100);
      document.getElementById('progressBar').style.width = pct + '%';
    } catch {}
  }

  async function generate() {
    if (generating) return;

    const prompt = document.getElementById('prompt').value.trim();
    if (!prompt) {
      showError('Digite um prompt antes de gerar.');
      return;
    }

    hideError();
    generating = true;

    const btn = document.getElementById('btnGenerate');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    btn.disabled = true;
    btnIcon.textContent = '⏳';
    btnText.textContent = 'Gerando...';

    const area = document.getElementById('imageArea');
    area.classList.add('generating');

    // remove previous image
    const prev = area.querySelector('img');
    if (prev) prev.remove();

    const progressWrap = document.getElementById('progressWrap');
    progressWrap.classList.add('active');
    document.getElementById('progressBar').style.width = '0%';
    progressInterval = setInterval(pollProgress, 800);

    const payload = {
      prompt: document.getElementById('prompt').value,
      negative_prompt: document.getElementById('negPrompt').value,
      width: parseInt(document.getElementById('width').value),
      height: parseInt(document.getElementById('height').value),
      steps: parseInt(document.getElementById('steps').value),
      cfg_scale: parseFloat(document.getElementById('cfg').value),
      seed: parseInt(document.getElementById('seed').value),
      sampler_name: 'Euler a',
      batch_size: 1,
      n_iter: 1,
    };

    lastPromptUsed = payload.prompt;

    try {
      const r = await fetch(getUrl() + '/sdapi/v1/txt2img', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      if (!r.ok) {
        const err = await r.text();
        throw new Error(err || `HTTP ${r.status}`);
      }

      const data = await r.json();
      const b64 = data.images?.[0];
      if (!b64) throw new Error('Nenhuma imagem retornada pelo servidor.');

      lastImageB64 = b64;

      const img = document.createElement('img');
      img.src = 'data:image/png;base64,' + b64;
      area.appendChild(img);

      // update seed if server returned one
      try {
        const info = JSON.parse(data.info || '{}');
        if (info.seed !== undefined && info.seed !== -1) {
          document.getElementById('seed').value = info.seed;
        }
      } catch {}

    } catch (e) {
      showError('Erro ao gerar: ' + e.message + '\n\nVerifique se o AUTOMATIC1111 está rodando e com --api ativado.');
    } finally {
      clearInterval(progressInterval);
      document.getElementById('progressBar').style.width = '100%';
      setTimeout(() => {
        progressWrap.classList.remove('active');
        document.getElementById('progressBar').style.width = '0%';
      }, 400);

      area.classList.remove('generating');
      generating = false;
      btn.disabled = false;
      btnIcon.textContent = '✨';
      btnText.textContent = 'Gerar Imagem';
    }
  }

  function downloadImage() {
    if (!lastImageB64) return;
    const a = document.createElement('a');
    a.href = 'data:image/png;base64,' + lastImageB64;
    a.download = 'image-creator-' + Date.now() + '.png';
    a.click();
  }

  function copyPromptFromMeta() {
    if (!lastPromptUsed) return;
    navigator.clipboard.writeText(lastPromptUsed).catch(() => {});
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('visible');
  }

  function hideError() {
    document.getElementById('errorMsg').classList.remove('visible');
  }

  // check on load
  ping();

  // allow Ctrl+Enter to generate
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') generate();
  });
</script>

</body>
</html>
