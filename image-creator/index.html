<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Creator</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface2: #22222e;
      --border: #2e2e40;
      --accent: #7c6af7;
      --accent2: #9d8fff;
      --text: #e8e6f0;
      --text2: #9490b0;
      --danger: #f74c6a;
      --success: #4caf82;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), #c084fc);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
    }

    header h1 { font-size: 1.2rem; font-weight: 600; letter-spacing: -0.02em; }

    header .badge {
      background: rgba(76,175,130,0.15);
      border: 1px solid rgba(76,175,130,0.35);
      border-radius: 20px;
      color: var(--success);
      font-size: 0.7rem;
      padding: 2px 10px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    main {
      display: flex;
      flex: 1;
    }

    .panel-left {
      width: 360px;
      min-width: 300px;
      border-right: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .panel-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 16px;
    }

    label {
      font-size: 0.73rem;
      font-weight: 700;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: block;
      margin-bottom: 7px;
    }

    textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.9rem;
      line-height: 1.55;
      padding: 11px 13px;
      resize: vertical;
      min-height: 100px;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    textarea:focus { outline: none; border-color: var(--accent); }
    textarea::placeholder { color: var(--text2); }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field { display: flex; flex-direction: column; }

    select, input[type=number] {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.88rem;
      padding: 9px 12px;
      width: 100%;
      font-family: inherit;
      transition: border-color 0.2s;
      cursor: pointer;
    }

    select:focus, input[type=number]:focus { outline: none; border-color: var(--accent); }
    select option { background: var(--surface2); }

    .seed-row { display: flex; gap: 6px; }
    .seed-row input { flex: 1; }

    .btn-sm {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text2);
      font-size: 0.88rem;
      padding: 9px 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-sm:hover { border-color: var(--accent); color: var(--accent2); }

    .btn-generate {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--accent), #c084fc);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-generate:hover { opacity: 0.88; }
    .btn-generate:active { transform: scale(0.98); }
    .btn-generate:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    .image-wrap { width: 100%; max-width: 560px; }

    .image-area {
      width: 100%;
      aspect-ratio: 1;
      background: var(--surface);
      border: 2px dashed var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text2);
      overflow: hidden;
      transition: border-color 0.3s;
      position: relative;
    }

    .image-area.landscape { aspect-ratio: 16/9; }
    .image-area.portrait  { aspect-ratio: 9/16; }
    .image-area.generating { border-color: var(--accent); border-style: solid; }

    .image-area img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      border-radius: 14px;
    }

    .placeholder-icon { font-size: 2.5rem; }
    .placeholder-text { font-size: 0.85rem; }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .gen-status {
      font-size: 0.82rem;
      color: var(--accent2);
      display: none;
    }

    .image-area.generating .spinner { display: block; }
    .image-area.generating .gen-status { display: block; }
    .image-area.generating .placeholder-icon,
    .image-area.generating .placeholder-text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .image-toolbar {
      display: none;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .image-toolbar.visible { display: flex; }

    .btn-tool {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text2);
      font-size: 0.82rem;
      padding: 8px 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-tool:hover { border-color: var(--accent); color: var(--accent2); }

    .error-msg {
      background: rgba(247,76,106,0.1);
      border: 1px solid rgba(247,76,106,0.3);
      border-radius: 8px;
      color: #f88;
      font-size: 0.82rem;
      padding: 10px 14px;
      display: none;
      line-height: 1.5;
    }

    .error-msg.visible { display: block; }

    .free-note {
      font-size: 0.74rem;
      color: var(--text2);
      text-align: center;
      line-height: 1.6;
    }

    @media (max-width: 680px) {
      main { flex-direction: column; }
      .panel-left { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🎨</div>
  <h1>Image Creator</h1>
  <span class="badge">✦ GRÁTIS</span>
</header>

<main>
  <div class="panel-left">

    <div class="field">
      <label>Prompt</label>
      <textarea id="prompt" placeholder="Descreva a imagem...&#10;Ex: beautiful woman, beach sunset, golden hour, photorealistic, 8k"></textarea>
    </div>

    <div class="field">
      <label>Prompt Negativo</label>
      <textarea id="negPrompt" style="min-height:65px" placeholder="O que evitar...&#10;Ex: blurry, deformed, ugly, watermark"></textarea>
    </div>

    <div class="settings-grid">
      <div class="field">
        <label>Modelo</label>
        <select id="model">
          <option value="flux">Flux (recomendado)</option>
          <option value="flux-realism">Flux Realism</option>
          <option value="flux-anime">Flux Anime</option>
          <option value="flux-3d">Flux 3D</option>
          <option value="any-dark">Any Dark</option>
          <option value="turbo">Turbo (rápido)</option>
        </select>
      </div>
      <div class="field">
        <label>Proporção</label>
        <select id="ratio" onchange="updateRatio()">
          <option value="1024x1024">1:1 Quadrado</option>
          <option value="1344x768">16:9 Paisagem</option>
          <option value="768x1344">9:16 Retrato</option>
          <option value="1216x832">3:2 Foto</option>
          <option value="832x1216">2:3 Foto vert.</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>Seed <span style="font-weight:400;text-transform:none;font-size:0.7rem">(0 = aleatório)</span></label>
      <div class="seed-row">
        <input type="number" id="seed" value="0" min="0">
        <button class="btn-sm" onclick="randomSeed()" title="Seed aleatório">🎲</button>
      </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <button class="btn-generate" id="btnGenerate" onclick="generate()">
      <span id="btnIcon">✨</span>
      <span id="btnText">Gerar Imagem</span>
    </button>

    <p class="free-note">
      Powered by <strong>Pollinations.ai</strong><br>
      100% gratuito · sem cadastro · sem limite
    </p>

  </div>

  <div class="panel-right">
    <div class="image-wrap">
      <div class="image-area" id="imageArea">
        <div class="spinner"></div>
        <div class="gen-status" id="genStatus">Gerando, aguarde...</div>
        <div class="placeholder-icon">🖼️</div>
        <div class="placeholder-text">A imagem aparece aqui</div>
      </div>
      <div class="image-toolbar" id="imageToolbar">
        <button class="btn-tool" onclick="downloadImage()">⬇ Salvar</button>
        <button class="btn-tool" onclick="copyPrompt()">📋 Copiar prompt</button>
        <button class="btn-tool" onclick="variation()">🔀 Variação</button>
        <button class="btn-tool" onclick="openFull()">🔍 Ver completa</button>
      </div>
    </div>
  </div>
</main>

<script>
  let lastImgUrl = null;
  let lastPromptUsed = '';
  let generating = false;
  let elapsed = 0;
  let timer = null;

  function updateRatio() {
    const area = document.getElementById('imageArea');
    const val = document.getElementById('ratio').value;
    const [w, h] = val.split('x').map(Number);
    area.className = 'image-area' + (generating ? ' generating' : '');
    if (w > h) area.classList.add('landscape');
    else if (h > w) area.classList.add('portrait');
  }

  function randomSeed() {
    document.getElementById('seed').value = Math.floor(Math.random() * 999999999);
  }

  async function generate() {
    if (generating) return;

    const prompt = document.getElementById('prompt').value.trim();
    if (!prompt) { showError('Digite um prompt antes de gerar.'); return; }

    hideError();
    generating = true;
    lastPromptUsed = prompt;

    const btn = document.getElementById('btnGenerate');
    btn.disabled = true;
    document.getElementById('btnIcon').textContent = '⏳';

    const area = document.getElementById('imageArea');
    area.classList.add('generating');
    const prev = area.querySelector('img');
    if (prev) prev.remove();
    document.getElementById('imageToolbar').classList.remove('visible');

    // elapsed timer
    elapsed = 0;
    const statusEl = document.getElementById('genStatus');
    clearInterval(timer);
    timer = setInterval(() => {
      elapsed++;
      statusEl.textContent = `Gerando... ${elapsed}s`;
      document.getElementById('btnText').textContent = `Gerando... ${elapsed}s`;
    }, 1000);

    const model   = document.getElementById('model').value;
    const ratio   = document.getElementById('ratio').value;
    const [w, h]  = ratio.split('x');
    const seed    = parseInt(document.getElementById('seed').value) || 0;
    const neg     = document.getElementById('negPrompt').value.trim();

    const params = new URLSearchParams({
      width: w,
      height: h,
      model: model,
      seed: seed,
      nologo: 'true',
      enhance: 'false',
    });

    if (neg) params.set('negative_prompt', neg);

    const encodedPrompt = encodeURIComponent(prompt);
    const url = `https://image.pollinations.ai/prompt/${encodedPrompt}?${params.toString()}`;

    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`Erro HTTP ${r.status}`);

      const blob = await r.blob();
      if (!blob.type.startsWith('image/')) throw new Error('Resposta inválida do servidor.');

      if (lastImgUrl) URL.revokeObjectURL(lastImgUrl);
      lastImgUrl = URL.createObjectURL(blob);

      const img = document.createElement('img');
      img.src = lastImgUrl;
      area.appendChild(img);
      document.getElementById('imageToolbar').classList.add('visible');

    } catch (e) {
      showError('Erro ao gerar: ' + e.message);
    } finally {
      clearInterval(timer);
      area.classList.remove('generating');
      generating = false;
      btn.disabled = false;
      document.getElementById('btnIcon').textContent = '✨';
      document.getElementById('btnText').textContent = 'Gerar Imagem';
    }
  }

  function downloadImage() {
    if (!lastImgUrl) return;
    const a = document.createElement('a');
    a.href = lastImgUrl;
    a.download = 'image-creator-' + Date.now() + '.png';
    a.click();
  }

  function copyPrompt() {
    if (!lastPromptUsed) return;
    navigator.clipboard.writeText(lastPromptUsed).then(() => {
      const btn = event.target;
      const orig = btn.textContent;
      btn.textContent = '✓ Copiado';
      setTimeout(() => btn.textContent = orig, 1500);
    });
  }

  function variation() {
    randomSeed();
    generate();
  }

  function openFull() {
    if (lastImgUrl) window.open(lastImgUrl, '_blank');
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('visible');
  }

  function hideError() {
    document.getElementById('errorMsg').classList.remove('visible');
  }

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') generate();
  });
</script>

</body>
</html>
