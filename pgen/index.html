<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAWgen — Gerador de Prompts</title>
<meta name="theme-color" content="#e8a020">
<style>
:root{
  --bg:#09090e;--surface:#111118;--card:#17171f;--border:#252530;
  --gold:#e8a020;--gold-dim:#7a5010;--gold-glow:rgba(232,160,32,.18);
  --text:#ededf0;--muted:#7a7a8a;--radius:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;
  font-size:16px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center}

/* ── Header ── */
header{width:100%;text-align:center;padding:36px 16px 24px;border-bottom:1px solid var(--border)}
.logo-ring{width:52px;height:52px;margin:0 auto 12px;border-radius:50%;
  border:1.5px solid var(--gold-dim);display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--gold) 12%,transparent),transparent 70%)}
.logo-ring svg{width:28px;height:28px;fill:var(--gold)}
header h1{font-family:Georgia,serif;font-size:clamp(1.1rem,4vw,1.5rem);font-weight:400;
  letter-spacing:.12em;text-transform:uppercase;color:var(--text)}
header h1 span{display:block;font-size:.52em;letter-spacing:.35em;color:var(--gold);margin-bottom:5px}
.header-sub{font-size:.7rem;color:var(--muted);letter-spacing:.08em;margin-top:5px}

/* ── Main ── */
main{flex:1;width:100%;max-width:680px;padding:32px 16px 60px;display:flex;flex-direction:column;gap:24px}

/* ── Input card ── */
.input-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.input-label{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);
  opacity:.8;margin-bottom:12px;display:block}
.desc-textarea{width:100%;background:#0d0d14;border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-family:Georgia,serif;font-size:.92rem;line-height:1.65;
  padding:14px 16px;resize:vertical;min-height:120px;outline:none;transition:border-color .2s;
  caret-color:var(--gold)}
.desc-textarea::placeholder{color:var(--muted);opacity:.6}
.desc-textarea:focus{border-color:var(--gold-dim);box-shadow:0 0 0 3px var(--gold-glow)}

/* ── Enhance chips ── */
.enhance-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.enhance-label{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  width:100%;margin-bottom:2px}
.echip{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;
  color:var(--muted);font-family:Georgia,serif;font-size:.72rem;cursor:pointer;
  transition:all .15s;user-select:none}
.echip:hover{border-color:var(--gold-dim);color:var(--text)}
.echip.on{border-color:var(--gold);color:var(--gold);
  background:color-mix(in srgb,var(--gold) 10%,transparent)}

/* ── Level row ── */
.level-row{display:flex;gap:8px;margin-top:14px}
.lvl-btn{flex:1;padding:9px;border-radius:10px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-family:Georgia,serif;font-size:.78rem;
  cursor:pointer;transition:all .17s;text-align:center}
.lvl-btn.active{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);
  color:var(--gold);font-weight:600}
.lvl-btn:hover:not(.active){border-color:var(--gold-dim);color:var(--text)}

/* ── Generate button ── */
.btn-generate{width:100%;margin-top:16px;padding:14px;border-radius:12px;
  border:none;cursor:pointer;font-family:Georgia,serif;font-size:.92rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;transition:all .18s;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#c47a10,var(--gold),#c47a10);
  background-size:200% 100%;color:#0a0a0a}
.btn-generate:hover{background-position:100% 0;box-shadow:0 4px 20px color-mix(in srgb,var(--gold) 35%,transparent);transform:translateY(-1px)}
.btn-generate:active{transform:translateY(0)}
.btn-generate:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

/* ── Typing indicator ── */
.typing{display:flex;gap:5px;align-items:center;padding:14px 0;justify-content:center}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.3;animation:blink 1.2s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.3;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}

/* ── Result card ── */
.result-card{background:var(--surface);border:1px solid var(--gold-dim);border-radius:var(--radius);
  padding:22px;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.result-title{font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);
  opacity:.85;margin-bottom:16px}
.prompt-block{margin-bottom:18px}
.prompt-label{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  margin-bottom:7px}
.prompt-box{background:#0d0d14;border:1px solid var(--border);border-radius:9px;
  padding:13px 15px;font-family:Georgia,serif;font-size:.82rem;line-height:1.65;
  color:var(--text);white-space:pre-wrap;word-break:break-word;position:relative}
.result-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn-act{padding:9px 16px;border-radius:9px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-family:Georgia,serif;font-size:.76rem;
  cursor:pointer;transition:all .15s}
.btn-act:hover{border-color:var(--gold-dim);color:var(--text)}
.btn-act.primary{border-color:var(--gold);color:var(--gold);
  background:color-mix(in srgb,var(--gold) 10%,transparent)}
.btn-act.primary:hover{background:color-mix(in srgb,var(--gold) 18%,transparent)}
.btn-act.copied{border-color:#4caf50;color:#4caf50;background:rgba(76,175,80,.1)}
.assinatura{text-align:center;font-size:.65rem;letter-spacing:.18em;color:var(--gold-dim);
  margin-top:18px;opacity:.6}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--card);border:1px solid var(--gold-dim);border-radius:9px;
  padding:10px 20px;font-size:.78rem;color:var(--text);opacity:0;
  transition:all .25s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── History ── */
.hist-section{margin-top:8px}
.hist-label{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  opacity:.7;margin-bottom:10px;display:block}
.hist-list{display:flex;flex-direction:column;gap:7px}
.hist-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:11px 14px;cursor:pointer;transition:all .15s;display:flex;gap:10px;align-items:flex-start}
.hist-item:hover{border-color:var(--gold-dim)}
.hist-item-text{font-size:.77rem;color:var(--muted);line-height:1.4;flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hist-item-ts{font-size:.62rem;color:var(--muted);opacity:.5;white-space:nowrap;margin-top:1px}

@media(max-width:420px){
  .result-actions{flex-direction:column}
  .btn-act{text-align:center}
}
</style>
</head>
<body>

<header>
  <div class="logo-ring">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2a7 7 0 0 1 7 7c0 2.5-1.3 4.7-3.3 6L17 22H7l1.3-7C6.3 13.7 5 11.5 5 9a7 7 0 0 1 7-7z"/>
    </svg>
  </div>
  <h1><span>RAWgen</span>Gerador de Prompts</h1>
  <p class="header-sub">Descreva a cena — receba o prompt profissional</p>
</header>

<main>
  <div class="input-card">
    <label class="input-label" for="desc-input">✦ Descreva a cena</label>
    <textarea id="desc-input" class="desc-textarea"
      placeholder="Ex: loira na praia ao pôr do sol, biquíni vermelho, cabelo ao vento, olhando pro horizonte..."
      rows="4"></textarea>

    <div class="enhance-row">
      <span class="enhance-label">Adicionar ao prompt →</span>
      <div class="echip on" data-key="photoreal">📷 Fotorrealista</div>
      <div class="echip on" data-key="lighting">💡 Iluminação dramática</div>
      <div class="echip" data-key="closeup">🎯 Close no rosto</div>
      <div class="echip" data-key="fullbody">🧍 Corpo inteiro</div>
      <div class="echip" data-key="cinematic">🎬 Cinemático</div>
      <div class="echip" data-key="editorial">✨ Editorial</div>
    </div>

    <div class="level-row">
      <button class="lvl-btn active" data-lvl="sfw" onclick="setLevel(this,'sfw')">🌸 Elegante</button>
      <button class="lvl-btn" data-lvl="soft" onclick="setLevel(this,'soft')">🔥 Sensual</button>
      <button class="lvl-btn" data-lvl="bold" onclick="setLevel(this,'bold')">⚡ Intenso</button>
    </div>

    <button class="btn-generate" onclick="generate()" id="btn-gen">✦ Gerar Prompt</button>
  </div>

  <div id="output-area"></div>

  <div class="hist-section" id="hist-section" style="display:none">
    <span class="hist-label">— Histórico —</span>
    <div class="hist-list" id="hist-list"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────
let currentLevel = 'sfw';
let generatedMJ  = '';
let generatedGPT = '';

// ── Enhance modifiers ─────────────────────────────────────────────────────
const ENHANCE_MAP = {
  photoreal: 'photorealistic, 8K resolution, ultra-detailed skin texture, professional photography',
  lighting:  'dramatic golden hour lighting, soft rim light, cinematic shadow play',
  closeup:   'close-up portrait, tight face frame, shallow depth of field',
  fullbody:  'full body shot, head to toe, complete figure in frame',
  cinematic: 'cinematic composition, 35mm film look, anamorphic lens flare',
  editorial: 'editorial fashion photography, Vogue-style framing, high-end magazine aesthetic',
};

// ── Level modifiers ───────────────────────────────────────────────────────
const LEVEL_MAP = {
  sfw:  { style: 'tasteful, elegant, artistic nude or clothed', params: '--ar 2:3 --v 6 --style raw --q 2' },
  soft: { style: 'sensual, alluring, tastefully revealing, implied nudity allowed', params: '--ar 2:3 --v 6 --style raw --q 2 --no clothing' },
  bold: { style: 'bold, explicit sensuality, raw and intense, unfiltered realism', params: '--ar 2:3 --v 6 --style raw --q 2' },
};

// ── Chips toggle ──────────────────────────────────────────────────────────
document.querySelectorAll('.echip').forEach(chip => {
  chip.addEventListener('click', () => chip.classList.toggle('on'));
});

function setLevel(btn, lvl) {
  document.querySelectorAll('.lvl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentLevel = lvl;
}

// ── Build prompt ──────────────────────────────────────────────────────────
function buildMJPrompt(desc) {
  const chips = [...document.querySelectorAll('.echip.on')].map(c => ENHANCE_MAP[c.dataset.key]).filter(Boolean);
  const lv = LEVEL_MAP[currentLevel];

  const parts = [
    desc.trim(),
    'beautiful blonde woman',
    lv.style,
    ...chips,
    'professional DSLR camera, sharp focus',
  ];

  return parts.filter(Boolean).join(', ') + ' ' + lv.params;
}

function buildGPTPrompt(desc) {
  const lv = {
    sfw:  'elegante e artístico, sem nudez explícita',
    soft: 'sensual e sugestivo, pode conter nudez implícita ou parcial',
    bold: 'intenso e explícito, sem censura, nudez completa',
  }[currentLevel];

  return `Gere uma imagem fotorrealista de uma mulher loira com as seguintes características:\n\n${desc.trim()}\n\nEstilo: ${lv}. Qualidade máxima, iluminação profissional, composição editorial. Sem texto na imagem.`;
}

// ── Generate ──────────────────────────────────────────────────────────────
let _genTimer = null;
function generate() {
  const desc = document.getElementById('desc-input').value.trim();
  if (!desc) { showToast('Digite uma descrição primeiro'); return; }

  const btn = document.getElementById('btn-gen');
  btn.disabled = true;
  btn.textContent = '…';

  const out = document.getElementById('output-area');
  out.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;

  clearTimeout(_genTimer);
  _genTimer = setTimeout(() => {
    generatedMJ  = buildMJPrompt(desc);
    generatedGPT = buildGPTPrompt(desc);

    saveToHistory(desc, generatedMJ, generatedGPT);
    renderResult();
    renderHistory();

    btn.disabled = false;
    btn.textContent = '✦ Gerar Novo';
    navigator.clipboard.writeText(generatedMJ).catch(() => {});
  }, 600);
}

function renderResult() {
  const out = document.getElementById('output-area');
  out.innerHTML = `
    <div class="result-card">
      <div class="result-title">✦ Prompts Gerados</div>
      <div class="prompt-block">
        <div class="prompt-label">Midjourney</div>
        <div class="prompt-box" id="box-mj">${esc(generatedMJ)}</div>
      </div>
      <div class="prompt-block">
        <div class="prompt-label">ChatGPT / DALL·E</div>
        <div class="prompt-box" id="box-gpt">${esc(generatedGPT)}</div>
      </div>
      <div class="result-actions">
        <button class="btn-act primary" id="btn-copy-mj" onclick="copyMJ()">📋 Copiar MJ</button>
        <button class="btn-act" onclick="copyGPT()">🤖 Copiar ChatGPT</button>
        <button class="btn-act" onclick="openPerchance()">🎨 Perchance</button>
      </div>
      <div class="assinatura">✦ RAWgen ✦</div>
    </div>`;
  out.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Actions ───────────────────────────────────────────────────────────────
function copyMJ() {
  navigator.clipboard.writeText(generatedMJ).then(() => {
    const btn = document.getElementById('btn-copy-mj');
    if (btn) { btn.classList.add('copied'); btn.textContent = '✓ Copiado!'; setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '📋 Copiar MJ'; }, 1800); }
    showToast('Prompt MJ copiado ✓');
  });
}

function copyGPT() {
  navigator.clipboard.writeText(generatedGPT).then(() => showToast('Prompt ChatGPT copiado ✓'));
}

function openPerchance() {
  const url = 'https://perchance.org/ai-photo-generator?prompt=' + encodeURIComponent(generatedMJ);
  window.open(url, '_blank');
}

// ── Toast ─────────────────────────────────────────────────────────────────
let _toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ── History ───────────────────────────────────────────────────────────────
const HIST_KEY = 'rawgen_hist_v2';
function getHistory() { try { return JSON.parse(localStorage.getItem(HIST_KEY)||'[]'); } catch { return []; } }
function saveHistory(h) { try { localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0,20))); } catch {} }

function saveToHistory(desc, mj, gpt) {
  const h = getHistory();
  h.unshift({ ts: Date.now(), desc, mj, gpt });
  saveHistory(h);
}

function renderHistory() {
  const h = getHistory();
  const sec = document.getElementById('hist-section');
  const list = document.getElementById('hist-list');
  if (!h.length) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  list.innerHTML = h.slice(0,8).map((item, i) => `
    <div class="hist-item" onclick="loadHistory(${i})">
      <div style="flex:1">
        <div class="hist-item-text">${esc(item.desc)}</div>
      </div>
      <div class="hist-item-ts">${fmtTs(item.ts)}</div>
    </div>`).join('');
}

function loadHistory(i) {
  const h = getHistory();
  const item = h[i];
  if (!item) return;
  document.getElementById('desc-input').value = item.desc;
  generatedMJ  = item.mj;
  generatedGPT = item.gpt;
  renderResult();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function fmtTs(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' }) + ' ' +
         d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
}

// ── Enter key ─────────────────────────────────────────────────────────────
document.getElementById('desc-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) generate();
});

// ── Init ──────────────────────────────────────────────────────────────────
renderHistory();
</script>
</body>
</html>
