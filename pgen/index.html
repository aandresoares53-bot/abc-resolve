<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAWgen — Gerador de Prompts</title>
<meta name="theme-color" content="#e8a020">
<style>
:root{
  --bg:#09090e;--surface:#111118;--card:#17171f;--border:#252530;
  --gold:#e8a020;--gold-dim:#7a5010;--gold-glow:rgba(232,160,32,.18);
  --text:#ededf0;--muted:#7a7a8a;--radius:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;
  font-size:16px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center}

/* ── Header ── */
header{width:100%;text-align:center;padding:28px 16px 18px;border-bottom:1px solid var(--border)}
.logo-ring{width:46px;height:46px;margin:0 auto 10px;border-radius:50%;
  border:1.5px solid var(--gold-dim);display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--gold) 12%,transparent),transparent 70%)}
.logo-ring svg{width:24px;height:24px;fill:var(--gold)}
header h1{font-family:Georgia,serif;font-size:clamp(1rem,3.5vw,1.35rem);font-weight:400;
  letter-spacing:.12em;text-transform:uppercase;color:var(--text)}
header h1 span{display:block;font-size:.52em;letter-spacing:.35em;color:var(--gold);margin-bottom:4px}
.header-sub{font-size:.68rem;color:var(--muted);letter-spacing:.07em;margin-top:4px}

/* ── Main ── */
main{flex:1;width:100%;max-width:680px;padding:24px 16px 60px;display:flex;flex-direction:column;gap:20px}

/* ── Step pill ── */
.step-pill{display:inline-flex;align-items:center;gap:6px;font-size:.6rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--gold);opacity:.8;margin-bottom:10px}
.step-num{width:18px;height:18px;border-radius:50%;border:1px solid var(--gold-dim);
  display:flex;align-items:center;justify-content:center;font-size:.6rem;color:var(--gold)}

/* ── Cards ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card-label{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);
  opacity:.8;margin-bottom:12px;display:block}

/* ── Textarea ── */
.desc-textarea{width:100%;background:#0d0d14;border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-family:Georgia,serif;font-size:.92rem;line-height:1.65;
  padding:14px 16px;resize:vertical;min-height:100px;outline:none;transition:border-color .2s;
  caret-color:var(--gold)}
.desc-textarea::placeholder{color:var(--muted);opacity:.55}
.desc-textarea:focus{border-color:var(--gold-dim);box-shadow:0 0 0 3px var(--gold-glow)}

/* ── Enhance chips ── */
.enhance-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.enhance-label{font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  width:100%;margin-bottom:1px}
.echip{padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:transparent;
  color:var(--muted);font-family:Georgia,serif;font-size:.7rem;cursor:pointer;
  transition:all .14s;user-select:none}
.echip:hover{border-color:var(--gold-dim);color:var(--text)}
.echip.on{border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}

/* ── Level row ── */
.level-row{display:flex;gap:8px;margin-top:14px}
.lvl-btn{flex:1;padding:9px;border-radius:10px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-family:Georgia,serif;font-size:.76rem;
  cursor:pointer;transition:all .16s;text-align:center}
.lvl-btn.active{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);
  color:var(--gold);font-weight:600}
.lvl-btn:hover:not(.active){border-color:var(--gold-dim);color:var(--text)}

/* ── Continue button ── */
.btn-continue{width:100%;margin-top:16px;padding:13px;border-radius:12px;border:none;
  cursor:pointer;font-family:Georgia,serif;font-size:.88rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;transition:all .18s;
  background:linear-gradient(135deg,#c47a10,var(--gold),#c47a10);background-size:200% 100%;color:#0a0a0a}
.btn-continue:hover{background-position:100% 0;box-shadow:0 4px 20px var(--gold-glow);transform:translateY(-1px)}
.btn-continue:active{transform:translateY(0)}
.btn-continue:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

/* ── Selector groups ── */
.selector-section{animation:fadeUp .28s ease}
.sel-group{margin-bottom:20px}
.sel-group-title{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);
  opacity:.85;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.sel-group-title span{opacity:.5;font-size:.85em}
.sel-chips{display:flex;flex-wrap:wrap;gap:7px}
.schap{padding:7px 14px;border-radius:22px;border:1px solid var(--border);background:transparent;
  color:var(--muted);font-family:Georgia,serif;font-size:.72rem;cursor:pointer;
  transition:all .15s;user-select:none;line-height:1.3}
.schap:hover{border-color:var(--gold-dim);color:var(--text)}
.schap.sel{border-color:var(--gold);color:var(--gold);
  background:color-mix(in srgb,var(--gold) 12%,transparent);font-weight:600}

/* ── Generate button ── */
.btn-gen{width:100%;margin-top:6px;padding:13px;border-radius:12px;border:none;
  cursor:pointer;font-family:Georgia,serif;font-size:.88rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;transition:all .18s;
  background:linear-gradient(135deg,#c47a10,var(--gold),#c47a10);background-size:200% 100%;color:#0a0a0a}
.btn-gen:hover{background-position:100% 0;box-shadow:0 4px 20px var(--gold-glow);transform:translateY(-1px)}
.btn-gen:active{transform:translateY(0)}
.btn-gen:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

/* ── Typing ── */
.typing{display:flex;gap:5px;align-items:center;padding:14px 0;justify-content:center}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.3;animation:blink 1.2s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.3;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── Result ── */
.result-card{background:var(--surface);border:1px solid var(--gold-dim);border-radius:var(--radius);
  padding:22px;animation:fadeUp .3s ease}
.result-title{font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);
  opacity:.85;margin-bottom:16px}
.prompt-block{margin-bottom:18px}
.prompt-label{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.prompt-box{background:#0d0d14;border:1px solid var(--border);border-radius:9px;
  padding:13px 15px;font-family:Georgia,serif;font-size:.82rem;line-height:1.65;
  color:var(--text);white-space:pre-wrap;word-break:break-word}
.result-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn-act{padding:9px 16px;border-radius:9px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-family:Georgia,serif;font-size:.75rem;cursor:pointer;transition:all .14s}
.btn-act:hover{border-color:var(--gold-dim);color:var(--text)}
.btn-act.primary{border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.btn-act.primary:hover{background:color-mix(in srgb,var(--gold) 18%,transparent)}
.btn-act.copied{border-color:#4caf50;color:#4caf50;background:rgba(76,175,80,.1)}
.btn-new{width:100%;margin-top:12px;padding:11px;border-radius:10px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-family:Georgia,serif;font-size:.8rem;cursor:pointer;transition:all .14s}
.btn-new:hover{border-color:var(--gold-dim);color:var(--text)}
.assinatura{text-align:center;font-size:.63rem;letter-spacing:.18em;color:var(--gold-dim);margin-top:18px;opacity:.6}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--card);border:1px solid var(--gold-dim);border-radius:9px;
  padding:10px 20px;font-size:.78rem;color:var(--text);opacity:0;
  transition:all .25s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── History ── */
.hist-section{margin-top:4px}
.hist-label{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  opacity:.65;margin-bottom:10px;display:block}
.hist-list{display:flex;flex-direction:column;gap:7px}
.hist-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:11px 14px;cursor:pointer;transition:all .14s;display:flex;gap:10px;align-items:flex-start}
.hist-item:hover{border-color:var(--gold-dim)}
.hist-item-text{font-size:.76rem;color:var(--muted);line-height:1.4;flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hist-item-ts{font-size:.6rem;color:var(--muted);opacity:.45;white-space:nowrap;margin-top:1px}

@media(max-width:420px){.result-actions,.level-row{flex-direction:column}.btn-act{text-align:center}}

/* ── Light theme ── */
[data-theme="light"]{
  --bg:#f4f3ee;--surface:#ffffff;--card:#ececea;--border:#d4d4c8;
  --gold:#b87800;--gold-dim:#a06800;--gold-glow:rgba(184,120,0,.14);
  --text:#1a1a22;--muted:#606070;
}
[data-theme="light"] .desc-textarea,[data-theme="light"] .prompt-box{background:#f8f7f2;border-color:var(--border)}
[data-theme="light"] body{background:var(--bg)}

/* ── Combos rápidos ── */
.combos-section{margin-bottom:0}
.combos-label{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  opacity:.65;margin-bottom:9px;display:block}
.combos-grid{display:flex;flex-wrap:wrap;gap:7px}
.combo-btn{padding:7px 13px;border-radius:22px;border:1px solid var(--border);background:transparent;
  color:var(--muted);font-family:Georgia,serif;font-size:.7rem;cursor:pointer;
  transition:all .15s;user-select:none;line-height:1.3}
.combo-btn:hover{border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 8%,transparent)}

/* ── Avançado accordion ── */
.advanced-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:11px 16px;border-radius:10px;border:1px solid var(--border);background:transparent;
  color:var(--muted);font-family:Georgia,serif;font-size:.72rem;letter-spacing:.1em;
  text-transform:uppercase;cursor:pointer;transition:all .18s;margin-top:4px}
.advanced-toggle:hover{border-color:var(--gold-dim);color:var(--text)}
.advanced-toggle .adv-arrow{font-size:.65rem;transition:transform .22s}
.advanced-toggle.open .adv-arrow{transform:rotate(180deg)}
.advanced-body{overflow:hidden;max-height:0;transition:max-height .3s ease}
.advanced-body.open{max-height:9999px}

/* ── Theme toggle ── */
.theme-toggle{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;
  border:1px solid var(--border);background:transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:1rem;transition:all .18s;color:var(--muted)}
.theme-toggle:hover{border-color:var(--gold-dim);color:var(--text)}
header{position:relative}
</style>
</head>

  <!-- Combos rápidos -->

  </button>
  <div class="advanced-body" id="adv-body">
    <div id="step2-area"></div>
  </div>

  <!-- Step 3: Result -->

  <!-- History -->
  <div class="hist-section" id="hist-section" style="display:none">
    <span class="hist-label">— Histórico —</span>
    <div class="hist-list" id="hist-list"></div>

</main>

function applyCombo(c) {
  const desc = document.getElementById('desc-input').value.trim();
  if (!desc) { showToast('Preencha a descrição da personagem primeiro ↑'); return; }
  // set level
  const lvlBtns = document.querySelectorAll('.lvl-btn');
  const lvlMap = {sfw:0, soft:1, bold:2};
  lvlBtns.forEach((b,i) => { b.classList.toggle('active', i === (lvlMap[c.level]||0)); });
  currentLevel = c.level || 'sfw';
  // set selections
  selAngle      = c.angle      || null;
  selPose       = c.pose       || null;
  selState      = c.state      || null;
  selLocation   = c.location   || null;
  selExpression = c.expression || null;
  renderSelectors();
  openAdvanced();
  generate();
  setTimeout(() => document.getElementById('output-area').scrollIntoView({behavior:'smooth',block:'start'}), 80);
}

function toggleAdvanced() {
  const btn  = document.getElementById('adv-toggle');
  const body = document.getElementById('adv-body');
  const isOpen = body.classList.toggle('open');
  btn.classList.toggle('open', isOpen);
}

function openAdvanced() {
  const btn  = document.getElementById('adv-toggle');
  const body = document.getElementById('adv-body');
  body.classList.add('open');
  btn.classList.add('open');
}

function renderCombos() {
  const grid = document.getElementById('combos-grid');
  if (!grid) return;
  grid.innerHTML = COMBOS.map((c,i) =>
    `<button class="combo-btn" onclick="applyCombo(COMBOS[${i}])">${c.label}</button>`
  ).join('');
}

          ${ANGLES.map(a=>`<div class="schap${selAngle===a.key?' sel':''}" onclick="pick('angle','${a.key}')">${a.label}</div>`).join('')}
        </div>
      </div>

      <div class="sel-group">
        <div class="sel-group-title">🧍 Posição / pose <span>escolha uma</span></div>
        <div class="sel-chips" id="chips-pose">
          ${POSES.map(p=>`<div class="schap${selPose===p.key?' sel':''}" onclick="pick('pose','${p.key}')">${p.label}</div>`).join('')}
        </div>
      </div>

      <div class="sel-group">
        <div class="sel-group-title">✨ Estado / condição <span>escolha um</span></div>
        <div class="sel-chips" id="chips-state">
          ${STATES.map(s=>`<div class="schap${selState===s.key?' sel':''}" onclick="pick('state','${s.key}')">${s.label}</div>`).join('')}
        </div>
      </div>

      <div class="sel-group">
        <div class="sel-group-title">📍 Cenário / locação <span>opcional</span></div>
        <div class="sel-chips" id="chips-location">
          ${LOCATIONS.map(l=>`<div class="schap${selLocation===l.key?' sel':''}" onclick="pick('location','${l.key}')">${l.label}</div>`).join('')}
        </div>
      </div>

      <div class="sel-group">
        <div class="sel-group-title">😶 Expressão / olhar <span>opcional</span></div>
        <div class="sel-chips" id="chips-expression">
          ${EXPRESSIONS.map(e=>`<div class="schap${selExpression===e.key?' sel':''}" onclick="pick('expression','${e.key}')">${e.label}</div>`).join('')}
        </div>
      </div>

      <button class="btn-gen" id="btn-gen" onclick="generate()" ${selAngle||selPose||selState||selLocation||selExpression?'':'disabled'}>Gerar Prompt →</button>
    </div>`;
}

function pick(group, key) {
  if (group === 'angle')      selAngle      = selAngle      === key ? null : key;
  if (group === 'pose')       selPose       = selPose       === key ? null : key;
  if (group === 'state')      selState      = selState      === key ? null : key;
  if (group === 'location')   selLocation   = selLocation   === key ? null : key;
  if (group === 'expression') selExpression = selExpression === key ? null : key;
  renderSelectors();
  if (selAngle || selPose || selState || selLocation || selExpression) generate();
}

// ── Generate ──────────────────────────────────────────────────────────────
async function generate() {
  const desc = document.getElementById('desc-input').value.trim();
  if (!desc) { showToast('Preencha a descrição da personagem primeiro ↑'); return; }

  const out = document.getElementById('output-area');
  out.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
  setTimeout(() => out.scrollIntoView({behavior:'smooth',block:'nearest'}), 60);

  const enDesc = await translateDesc(desc);
  const angleObj    = ANGLES.find(a=>a.key===selAngle);
  const poseObj     = POSES.find(p=>p.key===selPose);
  const stateObj    = STATES.find(s=>s.key===selState);
  const locationObj = LOCATIONS.find(l=>l.key===selLocation);
  const exprObj     = EXPRESSIONS.find(e=>e.key===selExpression);

  generatedMJ  = buildMJ(enDesc, angleObj, poseObj, stateObj, locationObj, exprObj);
  generatedGPT = buildGPT(enDesc, angleObj, poseObj, stateObj, locationObj, exprObj);

  const label = [angleObj?.label, poseObj?.label, stateObj?.label, locationObj?.label, exprObj?.label].filter(Boolean).join(' · ');
  saveToHistory(desc, label, generatedMJ, generatedGPT);
  renderResult(label);
  renderHistory();
  navigator.clipboard.writeText(generatedMJ).catch(()=>{});
}

// ── Build prompts ──────────────────────────────────────────────────────────
function buildMJ(enDesc, angle, pose, state, location, expr) {
  const chips = [...document.querySelectorAll('.echip.on')].map(c => ENHANCE_MAP[c.dataset.key]).filter(Boolean);
  const lv = LEVEL_MAP[currentLevel];
  const parts = [
    enDesc,
    'same person consistent appearance, identical face and body throughout, exact same physical features',
    expr?.en,
    angle?.en,
    pose?.en,
    state?.en,
    location?.en,
    lv.style,
    ...chips,
    'shot on DSLR, natural lens, sharp focus on subject, no digital retouching, no plastic skin, no CGI render',
  ];
  return parts.filter(Boolean).join(', ') + ' ' + lv.params;
}

// Deep sanitize for DALL-E — converts everything to editorial/fashion safe language
function sanitizeForDalle(text) {
  if (!text) return text;
  return text
    // Nudity
    .replace(/\bfully nude\b/gi, 'in a tasteful artistic pose')
    .replace(/\bartistic nude\b/gi, 'in a tasteful editorial pose')
    .replace(/\bnude\b/gi, 'in a tasteful pose')
    .replace(/\bnaked\b/gi, 'in a tasteful pose')
    .replace(/no censorship/gi, 'editorial style')
    .replace(/true human body/gi, 'natural human form')
    // Clothing removal refs
    .replace(/only in (panties?|underwear|bra|thong|bikini bottom)/gi, 'in minimal beachwear')
    .replace(/(panties?|thong)\s*(and\s*bra)?/gi, 'minimal beachwear')
    .replace(/\bbra\b/gi, 'crop top')
    .replace(/calcinha|sutiã/gi, 'beachwear')
    // Body parts
    .replace(/buttocks prominently (elevated|in frame|centered|raised)/gi, 'curved back silhouette highlighted')
    .replace(/buttocks/gi, 'lower body curves')
    .replace(/rear prominently/gi, 'back prominently')
    .replace(/hips raised high/gi, 'hips elevated')
    .replace(/full rear (body|silhouette)/gi, 'full back body')
    .replace(/rear (view|shot|body)/gi, 'back $1')
    // Explicit pose language
    .replace(/legs spread wide apart/gi, 'legs in a wide relaxed stance')
    .replace(/legs spread wide/gi, 'legs in a wide stance')
    .replace(/knees spread wide/gi, 'knees apart in a natural pose')
    .replace(/knees fallen wide apart/gi, 'knees relaxed outward')
    .replace(/soles of feet pressed together/gi, 'feet together')
    .replace(/hips open and low/gi, 'hips low and relaxed')
    .replace(/inner body view/gi, 'full body low angle')
    .replace(/between legs/gi, 'upward along body')
    .replace(/full inner body/gi, 'full body')
    // Intensity / explicit style
    .replace(/raw unfiltered realism/gi, 'natural realism')
    .replace(/genuine and intense/gi, 'genuine and confident')
    .replace(/candid intimacy/gi, 'candid natural moment')
    .replace(/intimate/gi, 'personal')
    .replace(/no airbrushing, no CGI, no plastic skin/gi, 'natural skin, no filters')
    .replace(/no digital smoothing, no plastic skin, no airbrushing/gi, 'natural authentic skin')
    .replace(/no CGI render/gi, 'no CGI')
    // Misc
    .replace(/glisten(ing|s)?/gi, 'shining')
    .replace(/drenched/gi, 'wet');
}

// Extract only the physical description (age, hair, eyes, body) — strip clothing/pose context
function extractPhysical(enDesc) {
  return enDesc
    .replace(/only in\b[^,]*/gi, '')
    .replace(/\b(wearing|dressed in|in just|just|barely)[^,]*/gi, '')
    .replace(/\b(panties?|thong|bra|bikini|lingerie|underwear|naked|nude|topless)[^,]*/gi, '')
    .replace(/,\s*,/g, ',').replace(/,\s*$/,'').trim();
}

function buildGPT(enDesc, angle, pose, state, location, expr) {
  const chips = [...document.querySelectorAll('.echip.on')].map(c => ENHANCE_MAP[c.dataset.key]).filter(Boolean);
  const physDesc   = sanitizeForDalle(extractPhysical(enDesc)) || sanitizeForDalle(enDesc);
  const safeAngle  = angle?.dalle    || sanitizeForDalle(angle?.en);
  const safePose   = pose?.dalle     || sanitizeForDalle(pose?.en);
  const safeState  = state?.dalle    || sanitizeForDalle(state?.en);
  const safeLoc    = location?.dalle || sanitizeForDalle(location?.en);
  const safeExpr   = expr?.dalle     || sanitizeForDalle(expr?.en);
  const safeChips  = chips.map(sanitizeForDalle);
  const parts = [
    physDesc,
    'consistent character appearance: same face, same eye color, same hair color and style, same body proportions',
    safeExpr,
    safeAngle,
    safePose,
    safeState,
    safeLoc,
    'high-end fashion editorial photography, natural skin texture, authentic human proportions, professional fashion shoot, all subjects fully clothed or in appropriate swimwear',
    ...safeChips,
    'professional camera, sharp focus on subject, natural lighting, no CGI, no filters',
    'no text, no watermark, 9:16 vertical portrait format',
  ];
  return 'Professional high-end fashion editorial photograph for a magazine, 9:16 vertical portrait format, fully clothed or appropriate swimwear only: ' + parts.filter(Boolean).join(', ') + '.';
}

// ── Translate ─────────────────────────────────────────────────────────────
async function translateDesc(text) {
  if (!text.trim()) return text;
  try {
    const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=pt|en';
    const res = await fetch(url);
    const data = await res.json();
    if (data.responseStatus === 200) return data.responseData.translatedText;
    throw 0;
  } catch {
    try {
      const url2 = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=pt&tl=en&dt=t&q=' + encodeURIComponent(text);
      const r2 = await fetch(url2);
      const d2 = await r2.json();
      return d2[0].map(s => s[0]).join('');
    } catch { return text; }
  }
}

// ── Render result ──────────────────────────────────────────────────────────
function renderResult(label) {
  const out = document.getElementById('output-area');
  out.innerHTML = `
    <div class="result-card">
      <div class="result-title">✦ Prompts Gerados${label ? ' — ' + esc(label) : ''}</div>
      <div class="prompt-block">
        <div class="prompt-label">Midjourney</div>
        <div class="prompt-box">${esc(generatedMJ)}</div>
      </div>
      <div class="prompt-block">
        <div class="prompt-label">ChatGPT / DALL·E</div>
        <div class="prompt-box">${esc(generatedGPT)}</div>
      </div>
      <div class="result-actions">
        <button class="btn-act primary" id="btn-copy-mj" onclick="copyMJ()">📋 Copiar MJ</button>
        <button class="btn-act" onclick="copyGPT()">🤖 Copiar ChatGPT</button>
        <button class="btn-act" onclick="openPerchance()">🎨 Perchance</button>
      </div>
      <button class="btn-new" onclick="restart()">← Nova Personagem</button>
      <div class="assinatura">✦ RAWgen ✦</div>
    </div>`;
  out.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Actions ───────────────────────────────────────────────────────────────
function copyMJ() {
  navigator.clipboard.writeText(generatedMJ).then(() => {
    const btn = document.getElementById('btn-copy-mj');
    if (btn){ btn.classList.add('copied'); btn.textContent='✓ Copiado!'; setTimeout(()=>{btn.classList.remove('copied');btn.textContent='📋 Copiar MJ';},1800); }
    showToast('Prompt MJ copiado ✓');
  });
}
function copyGPT(){ navigator.clipboard.writeText(generatedGPT).then(()=>showToast('Prompt ChatGPT copiado ✓')); }
function openPerchance(){ window.open('https://perchance.org/ai-photo-generator?prompt='+encodeURIComponent(generatedMJ),'_blank'); }

function restart() {
  document.getElementById('step2-area').innerHTML = '';
  document.getElementById('output-area').innerHTML = '';
  document.getElementById('desc-input').value = '';
  selAngle = null; selPose = null; selState = null; selLocation = null; selExpression = null;
  document.getElementById('desc-input').focus();
  window.scrollTo({top:0,behavior:'smooth'});
}

function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
  const next = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  document.getElementById('theme-btn').textContent = next === 'light' ? '🌙' : '☀️';
  try { localStorage.setItem('rawgen_theme', next); } catch {}
}
(function initTheme() {
  try {
    const saved = localStorage.getItem('rawgen_theme');
    if (saved === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      document.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('theme-btn');
        if (btn) btn.textContent = '🌙';
      });
    }
  } catch {}
})();

// ── Toast ─────────────────────────────────────────────────────────────────
let _tt = null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('show'),2200);
}

// ── History ───────────────────────────────────────────────────────────────
const HIST_KEY = 'rawgen_hist_v4';
function getHistory(){ try{ return JSON.parse(localStorage.getItem(HIST_KEY)||'[]'); }catch{ return []; } }
function saveHistory(h){ try{ localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0,20))); }catch{} }
function saveToHistory(desc, label, mj, gpt){
  const h = getHistory();
  h.unshift({ ts:Date.now(), desc, preset:label, mj, gpt,
    angle:selAngle, pose:selPose, state:selState, location:selLocation, expression:selExpression });
  saveHistory(h);
}
function renderHistory(){
  const h = getHistory();
  const sec = document.getElementById('hist-section');
  const list = document.getElementById('hist-list');
  if (!h.length){ sec.style.display='none'; return; }
  sec.style.display='block';
  list.innerHTML = h.slice(0,8).map((item,i)=>`
    <div class="hist-item" onclick="loadHistory(${i})">
      <div style="flex:1">
        <div class="hist-item-text">${esc(item.desc)} <span style="color:var(--gold);opacity:.7">· ${esc(item.preset||'')}</span></div>
      </div>
      <div class="hist-item-ts">${fmtTs(item.ts)}</div>
    </div>`).join('');
}
function loadHistory(i){
  const h=getHistory(); const item=h[i]; if(!item) return;
  document.getElementById('desc-input').value = item.desc;
  generatedMJ=item.mj; generatedGPT=item.gpt;
  selAngle=item.angle||null; selPose=item.pose||null; selState=item.state||null;
  selLocation=item.location||null; selExpression=item.expression||null;
  renderSelectors();
  renderResult(item.preset||'');
  window.scrollTo({top:0,behavior:'smooth'});
}
function fmtTs(ts){
  const d=new Date(ts);
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

renderHistory();
renderSelectors();
renderCombos();
</script>
