<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0d0d0d;--chat:#111;--bdr:#222;
  --bot-bg:#1a1a1a;--usr-bg:#e8a020;
  --txt:#e2e2e2;--txt2:#666;--txt3:#999;

  --r:14px;--r2:8px;

[data-theme="light"]{
  --bg:#f0ebe0;--chat:#faf5ec;--bdr:#e0d8cc;
  --bot-bg:#fff;--usr-bg:#e8a020;
  --txt:#1a1a1a;--txt2:#555;--txt3:#888;
}
html{height:100%;}
body{
  background:var(--bg);color:var(--txt);
  font-family:'Segoe UI',system-ui,sans-serif;
  display:flex;flex-direction:column;
  height:100vh;height:100dvh;overflow:hidden;
}

/* ── Header ── */
header{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;border-bottom:1px solid var(--bdr);
  background:var(--bg);z-index:10;
}
.logo{font-size:1.3em;font-weight:900;letter-spacing:-1px;color:var(--acc);line-height:1;}
.logo small{color:var(--txt2);font-size:0.45em;font-weight:300;letter-spacing:0;margin-left:4px;vertical-align:middle;}
.header-btns{display:flex;gap:7px;}
.hbtn{background:transparent;border:1px solid var(--bdr);color:var(--txt2);border-radius:var(--r2);padding:5px 11px;cursor:pointer;font-size:0.75em;font-weight:600;transition:all .15s;}
.hbtn:hover{border-color:var(--acc);color:var(--acc);}

/* ── Chat area ── */
#chat{
  flex:1;overflow-y:auto;
  padding:16px 16px 8px;
  display:flex;flex-direction:column;gap:10px;
  scroll-behavior:smooth;
}
#chat::-webkit-scrollbar{width:4px;}
#chat::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px;}

/* messages */
.msg{display:flex;gap:9px;max-width:82%;animation:fadeUp .25s ease;}
.msg.bot{align-self:flex-start;}
.msg.usr{align-self:flex-end;flex-direction:row-reverse;}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

.avatar{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:0.85em;margin-top:2px;
}
.bot .avatar{background:var(--acc);color:#000;font-weight:900;}
.usr .avatar{background:#333;color:#aaa;}

.bubble{
  padding:10px 14px;border-radius:var(--r);font-size:0.88em;line-height:1.55;
  max-width:100%;word-break:break-word;
}
.bot .bubble{background:var(--bot-bg);border:1px solid var(--bdr);border-bottom-left-radius:4px;}
.usr .bubble{background:var(--usr-bg);color:#000;font-weight:600;border-bottom-right-radius:4px;}

/* typing indicator */
.typing .bubble{padding:12px 16px;}
.dot-row{display:flex;gap:4px;align-items:center;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--txt3);animation:bounce .9s infinite;}
.dot:nth-child(2){animation-delay:.15s;}
.dot:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0);}40%{transform:translateY(-5px);}}

/* prompt output in chat */
.prompt-block{
  background:var(--bg);border:1px solid var(--acc);border-radius:var(--r2);
  padding:11px 13px;font-size:0.8em;font-family:monospace;
  line-height:1.7;word-break:break-word;color:var(--txt);
  margin-top:6px;cursor:text;user-select:all;
}
.neg-block{
  background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:var(--r2);
  padding:9px 13px;font-size:0.75em;font-family:monospace;
  line-height:1.6;color:#fca5a5;margin-top:6px;user-select:all;
}
.neg-title{font-size:.68em;font-weight:800;color:#f87171;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px;}
.copy-btn{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--acc);color:#000;border:none;border-radius:var(--r2);
  padding:7px 14px;cursor:pointer;font-weight:700;font-size:0.78em;
  margin-top:8px;transition:all .15s;
}
.copy-btn:hover{background:var(--acc2);}
.copy-btn.ok{background:var(--green);}
.restart-btn{
  display:inline-flex;align-items:center;gap:5px;
  background:transparent;border:1px solid var(--bdr);color:var(--txt3);border-radius:var(--r2);
  padding:7px 14px;cursor:pointer;font-size:0.78em;font-weight:600;
  margin-top:8px;margin-left:6px;transition:all .15s;
}
.restart-btn:hover{border-color:var(--acc);color:var(--acc);}

/* ── Quick-reply chips ── */
#qr-area{
  flex-shrink:0;
  padding:8px 14px 10px;
  border-top:1px solid var(--bdr);
  display:flex;flex-wrap:wrap;gap:5px;
  min-height:46px;
  background:var(--bg);
}
.qr{
  padding:5px 12px;border:1.5px solid var(--bdr);border-radius:20px;
  font-size:0.74em;font-weight:600;cursor:pointer;
  background:var(--bot-bg);color:var(--txt3);
  transition:all .13s;user-select:none;white-space:nowrap;
}
.qr:hover{border-color:var(--acc);color:var(--txt);}
.qr.skip{border-style:dashed;font-style:italic;}

/* ── Input bar ── */
#input-bar{
  flex-shrink:0;
  display:flex;align-items:flex-end;gap:8px;
  padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--bdr);
  background:var(--bg);
}
#msg-input{
  flex:1;background:var(--bot-bg);border:1.5px solid var(--bdr);
  border-radius:var(--r);color:var(--txt);
  padding:10px 14px;font-size:0.9em;font-family:inherit;
  resize:none;outline:none;line-height:1.5;max-height:120px;
  transition:border-color .2s;
}
#msg-input:focus{border-color:var(--acc);}
#msg-input::placeholder{color:var(--txt2);}
#send-btn{
  background:var(--acc);border:none;border-radius:var(--r);
  padding:10px 16px;cursor:pointer;font-size:1.1em;
  flex-shrink:0;transition:all .15s;color:#000;
  align-self:flex-end;height:42px;display:flex;align-items:center;
}
#send-btn:hover{background:var(--acc2);}
#send-btn:disabled{opacity:.4;cursor:default;}

/* responsive */
@media(max-width:500px){
  .msg{max-width:92%;}
  #qr-area{padding:6px 10px 8px;}
  #input-bar{padding:8px 10px 10px;}
  header{padding:10px 12px;}
}
</style>

function send(){
  const txt=input.value.trim();
  if(!txt||waiting) return;
  input.value=''; input.style.height='';
  addMsg('usr', escHtml(txt));
  processAnswer(txt);
}

function handleKey(e){
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); }
}

function autoResize(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,120)+'px';
}

function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function delay(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function botSay(html, qrs=[]){
  waiting=true;
  showTyping();
  await delay(600+Math.random()*300);
  removeTyping();
  addMsg('bot', html);
  setQR(qrs);
  waiting=false;
  input.focus();
}

async function processAnswer(val){
  const cur = STEPS[step];
  if(!cur) return;

  // skip keyword
  const isSkip = /^(pular|skip|não|nao|-)$/i.test(val.trim());
  if(!isSkip) answers[cur.id] = val;

  step++;
  clearQR();

  if(step < STEPS.length){
    const next=STEPS[step];
    const qrs = next.qr ? [...next.qr] : [];
    if(next.skip) qrs.push({label:'Pular →', val:'pular', skip:true});
    await botSay(next.ask, qrs);
  } else {
    await showResult();
  }
}

async function showResult(){
  waiting=true;
  showTyping();
  await delay(900);
  removeTyping();

  const prompt = buildPrompt();
  const neg = buildNeg();

  const b = addMsg('bot', '✅ <strong>Prompt RAW gerado!</strong> Clique no texto para selecionar tudo ou use o botão abaixo:');

  const pd = document.createElement('div');
  pd.className='prompt-block';
  pd.title='Clique para selecionar tudo';
  pd.textContent=prompt;
  pd.onclick=()=>{ const r=document.createRange();r.selectNodeContents(pd);const s=window.getSelection();s.removeAllRanges();s.addRange(r); };
  b.appendChild(pd);

  const nd = document.createElement('div');
  nd.className='neg-block';
  nd.innerHTML='<div class="neg-title">Negative Prompt</div>';
  const nt=document.createElement('div');
  nt.textContent=neg;
  nd.appendChild(nt);
  b.appendChild(nd);

  const copyBtn=document.createElement('button');
  copyBtn.className='copy-btn';
  copyBtn.innerHTML='📋 Copiar prompt';
  copyBtn.onclick=()=>{
    navigator.clipboard.writeText(prompt).then(()=>{
      copyBtn.textContent='✓ Copiado!';
      copyBtn.classList.add('ok');
      setTimeout(()=>{ copyBtn.innerHTML='📋 Copiar prompt'; copyBtn.classList.remove('ok'); },2000);
    });
  };
  b.appendChild(copyBtn);

  const restBtn=document.createElement('button');
  restBtn.className='restart-btn';
  restBtn.innerHTML='⟳ Novo prompt';
  restBtn.onclick=restart;
  b.appendChild(restBtn);

  scrollBottom();

  setQR([{label:'⟳ Criar novo prompt', val:'novo', skip:false}]);

  // handle "novo" quick reply
  qrArea.querySelector('.qr').onclick=restart;

  waiting=false;
}

// ─── Init & restart ────────────────────────────────────────────────────────
function restart(){
  step=0;
  Object.keys(answers).forEach(k=>delete answers[k]);
  chat.innerHTML='';
  clearQR();
  input.value='';
  waiting=false;
  init();
}

async function init(){
  const first=STEPS[0];
  await botSay(first.ask, first.qr||[]);
}

// ─── Theme ─────────────────────────────────────────────────────────────────
function toggleTheme(){
  const d=document.documentElement;
  const dark=d.dataset.theme==='dark';
  d.dataset.theme=dark?'light':'dark';
  document.getElementById('tbtn').textContent=dark?'🌙 Escuro':'☀ Claro';
}

// ─── Start ─────────────────────────────────────────────────────────────────
init();
</script>

</html>
