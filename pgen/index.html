<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAWgen — Gerador de Prompts</title>
<meta name="theme-color" content="#e8a020">
<style>
:root{
  --bg:#09090e;--surface:#111118;--card:#17171f;--border:#252530;
  --gold:#e8a020;--gold-dim:#7a5010;--gold-glow:rgba(232,160,32,.18);
  --text:#ededf0;--muted:#7a7a8a;--radius:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;
  font-size:16px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center}

/* ── Header ── */
header{width:100%;text-align:center;padding:28px 16px 18px;border-bottom:1px solid var(--border)}
.logo-ring{width:46px;height:46px;margin:0 auto 10px;border-radius:50%;
  border:1.5px solid var(--gold-dim);display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--gold) 12%,transparent),transparent 70%)}
.logo-ring svg{width:24px;height:24px;fill:var(--gold)}
header h1{font-family:Georgia,serif;font-size:clamp(1rem,3.5vw,1.35rem);font-weight:400;
  letter-spacing:.12em;text-transform:uppercase;color:var(--text)}
header h1 span{display:block;font-size:.52em;letter-spacing:.35em;color:var(--gold);margin-bottom:4px}
.header-sub{font-size:.68rem;color:var(--muted);letter-spacing:.07em;margin-top:4px}

/* ── Main ── */
main{flex:1;width:100%;max-width:680px;padding:24px 16px 60px;display:flex;flex-direction:column;gap:20px}

/* ── Step pill ── */
.step-pill{display:inline-flex;align-items:center;gap:6px;font-size:.6rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--gold);opacity:.8;margin-bottom:10px}
.step-num{width:18px;height:18px;border-radius:50%;border:1px solid var(--gold-dim);
  display:flex;align-items:center;justify-content:center;font-size:.6rem;color:var(--gold)}

/* ── Cards ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card-label{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);
  opacity:.8;margin-bottom:12px;display:block}

/* ── Textarea ── */
.desc-textarea{width:100%;background:#0d0d14;border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-family:Georgia,serif;font-size:.92rem;line-height:1.65;
  padding:14px 16px;resize:vertical;min-height:100px;outline:none;transition:border-color .2s;
  caret-color:var(--gold)}
.desc-textarea::placeholder{color:var(--muted);opacity:.55}
.desc-textarea:focus{border-color:var(--gold-dim);box-shadow:0 0 0 3px var(--gold-glow)}

/* ── Enhance chips ── */
.enhance-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.enhance-label{font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  width:100%;margin-bottom:1px}
.echip{padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:transparent;
  color:var(--muted);font-family:Georgia,serif;font-size:.7rem;cursor:pointer;
  transition:all .14s;user-select:none}
.echip:hover{border-color:var(--gold-dim);color:var(--text)}
.echip.on{border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}

/* ── Level row ── */
.level-row{display:flex;gap:8px;margin-top:14px}
.lvl-btn{flex:1;padding:9px;border-radius:10px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-family:Georgia,serif;font-size:.76rem;
  cursor:pointer;transition:all .16s;text-align:center}
.lvl-btn.active{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);
  color:var(--gold);font-weight:600}
.lvl-btn:hover:not(.active){border-color:var(--gold-dim);color:var(--text)}

/* ── Continue button ── */
.btn-continue{width:100%;margin-top:16px;padding:13px;border-radius:12px;border:none;
  cursor:pointer;font-family:Georgia,serif;font-size:.88rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;transition:all .18s;
  background:linear-gradient(135deg,#c47a10,var(--gold),#c47a10);background-size:200% 100%;color:#0a0a0a}
.btn-continue:hover{background-position:100% 0;box-shadow:0 4px 20px var(--gold-glow);transform:translateY(-1px)}
.btn-continue:active{transform:translateY(0)}
.btn-continue:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

/* ── Preset grid ── */
.preset-section{animation:fadeUp .28s ease}
.preset-cats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.pcat{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:transparent;
  color:var(--muted);font-family:Georgia,serif;font-size:.72rem;cursor:pointer;transition:all .14s}
.pcat.active{border-color:var(--gold-dim);color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.pcat:hover:not(.active){border-color:var(--gold-dim);color:var(--text)}
.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(min-width:520px){.preset-grid{grid-template-columns:repeat(3,1fr)}}
.preset-card{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:14px 12px;cursor:pointer;transition:border-color .16s,background .16s,transform .14s,box-shadow .16s;
  position:relative;overflow:hidden}
.preset-card::before{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 10%,transparent),transparent 60%);
  opacity:0;transition:opacity .18s}
.preset-card:hover{border-color:var(--gold);transform:translateY(-2px);
  box-shadow:0 6px 20px color-mix(in srgb,var(--gold) 15%,transparent)}
.preset-card:hover::before{opacity:1}
.preset-card:active{transform:translateY(0)}
.preset-card.selected{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.pc-emoji{font-size:1.5rem;margin-bottom:6px;display:block}
.pc-name{font-family:Georgia,serif;font-size:.78rem;font-weight:700;color:var(--gold);
  margin-bottom:4px;line-height:1.2}
.pc-angle{font-size:.6rem;color:var(--muted);line-height:1.3;margin-bottom:2px}
.pc-pose{font-size:.6rem;color:var(--muted);opacity:.75;line-height:1.3}

/* ── Typing ── */
.typing{display:flex;gap:5px;align-items:center;padding:14px 0;justify-content:center}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.3;animation:blink 1.2s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.3;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── Result ── */
.result-card{background:var(--surface);border:1px solid var(--gold-dim);border-radius:var(--radius);
  padding:22px;animation:fadeUp .3s ease}
.result-title{font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);
  opacity:.85;margin-bottom:16px}
.prompt-block{margin-bottom:18px}
.prompt-label{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.prompt-box{background:#0d0d14;border:1px solid var(--border);border-radius:9px;
  padding:13px 15px;font-family:Georgia,serif;font-size:.82rem;line-height:1.65;
  color:var(--text);white-space:pre-wrap;word-break:break-word}
.result-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn-act{padding:9px 16px;border-radius:9px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-family:Georgia,serif;font-size:.75rem;cursor:pointer;transition:all .14s}
.btn-act:hover{border-color:var(--gold-dim);color:var(--text)}
.btn-act.primary{border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.btn-act.primary:hover{background:color-mix(in srgb,var(--gold) 18%,transparent)}
.btn-act.copied{border-color:#4caf50;color:#4caf50;background:rgba(76,175,80,.1)}
.btn-new{width:100%;margin-top:12px;padding:11px;border-radius:10px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-family:Georgia,serif;font-size:.8rem;cursor:pointer;transition:all .14s}
.btn-new:hover{border-color:var(--gold-dim);color:var(--text)}
.assinatura{text-align:center;font-size:.63rem;letter-spacing:.18em;color:var(--gold-dim);margin-top:18px;opacity:.6}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--card);border:1px solid var(--gold-dim);border-radius:9px;
  padding:10px 20px;font-size:.78rem;color:var(--text);opacity:0;
  transition:all .25s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── History ── */
.hist-section{margin-top:4px}
.hist-label{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  opacity:.65;margin-bottom:10px;display:block}
.hist-list{display:flex;flex-direction:column;gap:7px}
.hist-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:11px 14px;cursor:pointer;transition:all .14s;display:flex;gap:10px;align-items:flex-start}
.hist-item:hover{border-color:var(--gold-dim)}
.hist-item-text{font-size:.76rem;color:var(--muted);line-height:1.4;flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hist-item-ts{font-size:.6rem;color:var(--muted);opacity:.45;white-space:nowrap;margin-top:1px}

@media(max-width:420px){.result-actions,.level-row{flex-direction:column}.btn-act{text-align:center}}
</style>
</head>

    </div>

    <div class="level-row">
      <button class="lvl-btn active" onclick="setLevel(this,'sfw')">🌸 Elegante</button>
      <button class="lvl-btn" onclick="setLevel(this,'soft')">🔥 Sensual</button>
      <button class="lvl-btn" onclick="setLevel(this,'bold')">⚡ Intenso</button>
    </div>

    <button class="btn-continue" onclick="showPresets()" id="btn-continue">Escolher Cenário →</button>
  </div>

  <!-- Step 2: Presets -->

  <!-- Step 3: Result -->

  <!-- History -->

    <span class="hist-label">— Histórico —</span>
    <div class="hist-list" id="hist-list"></div>
  </div>

</main>

<div class="toast" id="toast"></div>

// ── Enhance & Level ───────────────────────────────────────────────────────
const ENHANCE_MAP = {
  photoreal: 'photorealistic, 8K resolution, ultra-detailed skin texture, professional photography',
  lighting:  'dramatic golden hour lighting, soft rim light, cinematic shadow play',
  closeup:   'close-up portrait, tight face frame, shallow depth of field',
  fullbody:  'full body shot, head to toe, complete figure in frame',
  cinematic: 'cinematic composition, 35mm film look, anamorphic lens flare',
  editorial: 'editorial fashion photography, Vogue-style framing, high-end magazine aesthetic',
};
const LEVEL_MAP = {
  sfw:  { style:'tasteful, elegant, artistic',                                      params:'--ar 2:3 --v 6 --style raw --q 2' },
  soft: { style:'sensual, alluring, tastefully revealing, implied nudity',          params:'--ar 2:3 --v 6 --style raw --q 2' },
  bold: { style:'bold, explicit sensuality, raw and intense, unfiltered realism',   params:'--ar 2:3 --v 6 --style raw --q 2' },
};

document.querySelectorAll('.echip').forEach(c => c.addEventListener('click', () => c.classList.toggle('on')));
function setLevel(btn, lvl) {
  document.querySelectorAll('.lvl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentLevel = lvl;
}

// ── Translate ─────────────────────────────────────────────────────────────
async function translateDesc(text) {
  if (!text.trim()) return text;
  try {
    const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=pt|en';
    const res = await fetch(url);
    const data = await res.json();
    if (data.responseStatus === 200) return data.responseData.translatedText;
    throw 0;
  } catch {
    try {
      const url2 = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=pt&tl=en&dt=t&q=' + encodeURIComponent(text);
      const r2 = await fetch(url2);
      const d2 = await r2.json();
      return d2[0].map(s => s[0]).join('');
    } catch { return text; }
  }
}

// ── Show presets ──────────────────────────────────────────────────────────
let currentCat = 'Todos';
function showPresets() {
  const desc = document.getElementById('desc-input').value.trim();
  if (!desc) { showToast('Digite a descrição da personagem primeiro'); return; }
  currentCat = 'Todos';
  renderPresetSection();
  setTimeout(() => document.getElementById('step2-area').scrollIntoView({behavior:'smooth',block:'start'}), 80);
}

function renderPresetSection() {
  const area = document.getElementById('step2-area');
  const filtered = currentCat === 'Todos' ? PRESETS : PRESETS.filter(p => p.cat === currentCat);
  const cats = area.innerHTML === '' ? '' : area.querySelector('.preset-cats')?.innerHTML || '';

  area.innerHTML = `
    <div class="card preset-section">
      <span class="step-pill"><span class="step-num">2</span> Cenário · Ângulo · Pose</span>
      <div class="preset-cats">
        ${PRESET_CATS.map(c => `<div class="pcat${c===currentCat?' active':''}" onclick="filterCat('${c}')">${c}</div>`).join('')}
      </div>
      <div class="preset-grid">
        ${filtered.map((p,i) => `
          <div class="preset-card" onclick="selectPreset(${PRESETS.indexOf(p)})">
            <span class="pc-emoji">${p.emoji}</span>
            <div class="pc-name">${p.name}</div>
            <div class="pc-angle">📐 ${p.anglePT}</div>
            <div class="pc-pose">🧍 ${p.posePT}</div>
          </div>`).join('')}
      </div>
    </div>`;
}

function filterCat(cat) {
  currentCat = cat;
  renderPresetSection();
}

// ── Select preset → generate ───────────────────────────────────────────────
async function selectPreset(idx) {
  selectedPreset = PRESETS[idx];
  // highlight card
  document.querySelectorAll('.preset-card').forEach((c,i) => {
    c.classList.toggle('selected', PRESETS.filter(p => currentCat==='Todos'||p.cat===currentCat).indexOf(selectedPreset) === i);
  });

  const out = document.getElementById('output-area');
  out.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
  setTimeout(() => out.scrollIntoView({behavior:'smooth',block:'nearest'}), 60);

  const rawDesc = document.getElementById('desc-input').value.trim();
  const enDesc  = await translateDesc(rawDesc);

  generatedMJ  = buildMJ(enDesc, selectedPreset);
  generatedGPT = buildGPT(enDesc, selectedPreset);

  saveToHistory(rawDesc, selectedPreset.name, generatedMJ, generatedGPT);
  renderResult();
  renderHistory();
  navigator.clipboard.writeText(generatedMJ).catch(()=>{});
}

// ── Build prompts ──────────────────────────────────────────────────────────
function buildMJ(enDesc, preset) {
  const chips = [...document.querySelectorAll('.echip.on')].map(c => ENHANCE_MAP[c.dataset.key]).filter(Boolean);
  const lv = LEVEL_MAP[currentLevel];
  const parts = [
    enDesc,
    'beautiful blonde woman',
    preset.scenario,
    preset.angle,
    preset.pose,
    lv.style,
    ...chips,
    'professional DSLR camera, sharp focus',
  ];
  return parts.filter(Boolean).join(', ') + ' ' + lv.params;
}

function buildGPT(enDesc, preset) {
  const chips = [...document.querySelectorAll('.echip.on')].map(c => ENHANCE_MAP[c.dataset.key]).filter(Boolean);
  const lv = LEVEL_MAP[currentLevel];
  const parts = [
    enDesc,
    'beautiful blonde woman',
    preset.scenario,
    preset.angle,
    preset.pose,
    lv.style,
    ...chips,
    'professional DSLR camera, sharp focus',
    'no text in image',
  ];
  return 'Generate a photorealistic image: ' + parts.filter(Boolean).join(', ') + '.';
}

// ── Render result ──────────────────────────────────────────────────────────
function renderResult() {
  const out = document.getElementById('output-area');
  out.innerHTML = `
    <div class="result-card">
      <div class="result-title">✦ Prompts Gerados — ${esc(selectedPreset?.name||'')}</div>
      <div class="prompt-block">
        <div class="prompt-label">Midjourney</div>
        <div class="prompt-box">${esc(generatedMJ)}</div>
      </div>
      <div class="prompt-block">
        <div class="prompt-label">ChatGPT / DALL·E</div>
        <div class="prompt-box">${esc(generatedGPT)}</div>
      </div>
      <div class="result-actions">
        <button class="btn-act primary" id="btn-copy-mj" onclick="copyMJ()">📋 Copiar MJ</button>
        <button class="btn-act" onclick="copyGPT()">🤖 Copiar ChatGPT</button>
        <button class="btn-act" onclick="openPerchance()">🎨 Perchance</button>
      </div>
      <button class="btn-new" onclick="restart()">← Nova Personagem</button>
      <div class="assinatura">✦ RAWgen ✦</div>
    </div>`;
  out.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Actions ───────────────────────────────────────────────────────────────
function copyMJ() {
  navigator.clipboard.writeText(generatedMJ).then(() => {
    const btn = document.getElementById('btn-copy-mj');
    if (btn){ btn.classList.add('copied'); btn.textContent='✓ Copiado!'; setTimeout(()=>{btn.classList.remove('copied');btn.textContent='📋 Copiar MJ';},1800); }
    showToast('Prompt MJ copiado ✓');
  });
}
function copyGPT(){ navigator.clipboard.writeText(generatedGPT).then(()=>showToast('Prompt ChatGPT copiado ✓')); }
function openPerchance(){ window.open('https://perchance.org/ai-photo-generator?prompt='+encodeURIComponent(generatedMJ),'_blank'); }

function restart() {
  document.getElementById('step2-area').innerHTML = '';
  document.getElementById('output-area').innerHTML = '';
  document.getElementById('desc-input').value = '';
  document.getElementById('desc-input').focus();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ── Toast ─────────────────────────────────────────────────────────────────
let _tt = null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('show'),2200);
}

// ── History ───────────────────────────────────────────────────────────────
const HIST_KEY = 'rawgen_hist_v3';
function getHistory(){ try{ return JSON.parse(localStorage.getItem(HIST_KEY)||'[]'); }catch{ return []; } }
function saveHistory(h){ try{ localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0,20))); }catch{} }
function saveToHistory(desc, preset, mj, gpt){
  const h = getHistory();
  h.unshift({ ts:Date.now(), desc, preset, mj, gpt });
  saveHistory(h);
}
function renderHistory(){
  const h = getHistory();
  const sec = document.getElementById('hist-section');
  const list = document.getElementById('hist-list');
  if (!h.length){ sec.style.display='none'; return; }
  sec.style.display='block';
  list.innerHTML = h.slice(0,8).map((item,i)=>`
    <div class="hist-item" onclick="loadHistory(${i})">
      <div style="flex:1">
        <div class="hist-item-text">${esc(item.desc)} <span style="color:var(--gold);opacity:.7">· ${esc(item.preset||'')}</span></div>
      </div>
      <div class="hist-item-ts">${fmtTs(item.ts)}</div>
    </div>`).join('');
}
function loadHistory(i){
  const h=getHistory(); const item=h[i]; if(!item) return;
  document.getElementById('desc-input').value = item.desc;
  generatedMJ=item.mj; generatedGPT=item.gpt;
  selectedPreset = PRESETS.find(p=>p.name===item.preset)||null;
  renderResult();
  window.scrollTo({top:0,behavior:'smooth'});
}
function fmtTs(ts){
  const d=new Date(ts);
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

// ── Enter shortcut ─────────────────────────────────────────────────────────
document.getElementById('desc-input').addEventListener('keydown', e=>{
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)) showPresets();
});

// ── Init ───────────────────────────────────────────────────────────────────
renderHistory();
