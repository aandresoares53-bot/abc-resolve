<head>
<meta charset="UTF-8">

<title>RAWgen Loiras</title>

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#080808;--surface:#111116;--surface2:#18181f;--surface3:#1e1e28;
  --bdr:#252530;--bdr2:#2e2e3a;
  --acc:#e8a020;--acc2:#f0b840;--acc-glow:rgba(232,160,32,.18);
  --txt:#ededf0;--txt2:#7a7a8a;--txt3:#44445a;
  --green:#22c55e;--red:#ef4444;--orange:#f59e0b;
  --r:14px;--r2:9px;--sidebar:270px;
}
[data-theme="light"]{
  --bg:#f2ede4;--surface:#fff;--surface2:#f5f0e8;--surface3:#ede8de;
  --bdr:#ddd6c8;--bdr2:#ccc4b4;
  --txt:#141414;--txt2:#666;--txt3:#aaa;
}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;}
body{background:var(--bg);color:var(--txt);display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* ── HEADER ── */
header{
  flex-shrink:0;display:flex;align-items:center;gap:12px;
  padding:9px 16px;border-bottom:1px solid var(--bdr);
  background:var(--surface);z-index:20;
  box-shadow:0 1px 0 var(--bdr2);
}
.logo{font-size:1.1rem;font-weight:900;color:var(--acc);letter-spacing:-0.5px;white-space:nowrap;
  text-shadow:0 0 20px var(--acc-glow);}
.logo span{color:var(--txt3);font-weight:400;font-size:.78em;margin-left:5px;}
.header-search{
  flex:1;background:var(--bg);border:1px solid var(--bdr);
  border-radius:var(--r2);color:var(--txt);padding:7px 13px;
  font-size:.85rem;font-family:inherit;outline:none;max-width:440px;
  transition:border-color .2s,box-shadow .2s;
}
.header-search:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-glow);}
.header-search::placeholder{color:var(--txt3);}
.hbtn{
  background:var(--surface2);border:1px solid var(--bdr);
  color:var(--txt2);border-radius:var(--r2);padding:6px 12px;
  cursor:pointer;font-size:.75rem;font-weight:600;white-space:nowrap;
  transition:all .15s;font-family:inherit;
}
.hbtn:hover{border-color:var(--acc);color:var(--acc);background:var(--surface3);}

/* ── LAYOUT ── */
.app-body{display:flex;flex:1;overflow:hidden;}

/* ── SIDEBAR ── */
.sidebar{
  width:var(--sidebar);min-width:var(--sidebar);
  border-right:1px solid var(--bdr);background:var(--surface);
  display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;
}
.level-pills{
  display:flex;gap:5px;padding:10px 11px;border-bottom:1px solid var(--bdr);flex-wrap:wrap;
}
.pill{
  background:var(--surface2);border:1px solid var(--bdr);
  border-radius:20px;color:var(--txt2);font-size:.68rem;font-weight:700;
  padding:4px 11px;cursor:pointer;transition:all .15s;white-space:nowrap;
  letter-spacing:.02em;
}
.pill:hover{border-color:var(--acc);color:var(--acc);background:var(--surface3);}
.pill.active{border-color:var(--acc);color:var(--acc);background:var(--acc-glow);
  box-shadow:0 0 8px var(--acc-glow);}
.cat-list{flex:1;overflow-y:auto;padding:6px 0;}
.cat-list::-webkit-scrollbar{width:3px;}
.cat-list::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:2px;}
.cat-item{
  display:flex;align-items:center;gap:9px;
  padding:8px 14px;cursor:pointer;transition:background .15s,border-color .15s;
  font-size:.83rem;border-left:3px solid transparent;
}
.cat-item:hover{background:var(--surface2);}
.cat-item.active{background:var(--acc-glow);border-left-color:var(--acc);color:var(--acc);}
.cat-icon{font-size:.95rem;width:20px;text-align:center;flex-shrink:0;}
.cat-name{flex:1;font-weight:600;}
.cat-badge{
  background:var(--surface3);border:1px solid var(--bdr2);
  border-radius:20px;color:var(--txt3);font-size:.62rem;
  font-weight:700;padding:1px 7px;
}
.cat-item.active .cat-badge{border-color:rgba(232,160,32,.5);color:var(--acc);}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.grid-wrap{flex:1;overflow-y:auto;padding:14px;}
.grid-wrap::-webkit-scrollbar{width:4px;}
.grid-wrap::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px;}
.section-title{
  font-size:.66rem;font-weight:800;color:var(--txt3);
  text-transform:uppercase;letter-spacing:.1em;
  margin:4px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--bdr);
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(195px,1fr));
  gap:9px;margin-bottom:18px;
}
.card{
  background:var(--surface);border:1px solid var(--bdr);
  border-radius:var(--r);padding:13px 14px;cursor:pointer;
  transition:border-color .18s,transform .18s,box-shadow .18s,background .18s;
  position:relative;animation:fadeUp .3s ease both;
  animation-delay:calc(var(--i,0) * 18ms);
}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.card:hover{
  border-color:var(--acc);transform:translateY(-3px);
  box-shadow:0 6px 24px rgba(232,160,32,.12),0 1px 4px rgba(0,0,0,.4);
  background:var(--surface2);
}
.card.selected{
  border-color:var(--acc);background:var(--acc-glow);
  box-shadow:0 0 0 1px var(--acc),0 6px 24px rgba(232,160,32,.15);
}
.card-icon{font-size:1.5rem;margin-bottom:7px;line-height:1;}
.card-name{font-size:.83rem;font-weight:700;line-height:1.3;margin-bottom:4px;}
.card-desc{font-size:.72rem;color:var(--txt2);line-height:1.45;}
.card-badge{
  display:inline-block;margin-top:8px;
  border-radius:20px;font-size:.6rem;font-weight:700;
  padding:2px 8px;border:1px solid;letter-spacing:.03em;
}
.badge-sfw{color:var(--green);border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.07);}
.badge-sensual{color:var(--orange);border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.07);}
.badge-explicit{color:var(--red);border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.07);}

.no-results{
  text-align:center;padding:60px 20px;color:var(--txt3);
  font-size:.88rem;
}

/* ── RESULT PANEL ── */
#result-panel{
  flex-shrink:0;border-top:2px solid var(--acc);
  background:var(--surface);display:none;
  max-height:52vh;overflow-y:auto;
  box-shadow:0 -4px 24px rgba(0,0,0,.4);
}
#result-panel.open{display:block;}
.result-header{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;border-bottom:1px solid var(--bdr);
  position:sticky;top:0;background:var(--surface);z-index:5;
  backdrop-filter:blur(4px);
}
.result-title{font-size:.85rem;font-weight:700;color:var(--acc);flex:1;
  text-shadow:0 0 12px var(--acc-glow);}
.result-body{padding:12px 16px;display:grid;gap:10px;}
.result-label{font-size:.65rem;font-weight:800;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
.edit-fields{background:var(--surface2);border:1px solid var(--bdr);border-radius:var(--r2);padding:12px;display:grid;gap:8px;}
.edit-field{display:grid;gap:4px;}
.edit-label{font-size:.65rem;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.06em;}
.edit-input{background:var(--bg);border:1px solid var(--bdr2);border-radius:var(--r2);color:var(--txt);padding:8px 10px;font-size:.78rem;font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s;}
.edit-input:focus{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-glow);}
.edit-input::placeholder{color:var(--txt3);}
.btn-apply{background:var(--surface3);border:1px solid var(--bdr2);border-radius:var(--r2);color:var(--acc);font-size:.75rem;font-weight:700;padding:7px 14px;cursor:pointer;transition:background .2s,border-color .2s;width:fit-content;}
.btn-apply:hover{background:var(--acc);color:#000;border-color:var(--acc);}
.result-ta{
  width:100%;background:var(--bg);border:1px solid var(--bdr);
  border-radius:var(--r2);color:var(--txt);padding:10px 12px;
  font-size:.78rem;font-family:monospace;line-height:1.55;
  resize:vertical;outline:none;transition:border-color .2s,box-shadow .2s;
  min-height:80px;
}
.result-ta:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-glow);}
.result-ta.neg{min-height:58px;color:var(--txt2);font-size:.71rem;}
.btn-row{display:flex;gap:7px;flex-wrap:wrap;}
.btn-action{
  background:var(--surface2);border:1px solid var(--bdr);
  color:var(--txt2);border-radius:var(--r2);padding:7px 14px;
  cursor:pointer;font-size:.75rem;font-weight:600;
  transition:all .15s;font-family:inherit;white-space:nowrap;
}
.btn-action:hover{border-color:var(--acc);color:var(--acc);background:var(--surface3);}
.btn-action.primary{background:var(--acc);border-color:var(--acc);color:#000;font-weight:700;}
.btn-action.primary:hover{background:var(--acc2);box-shadow:0 2px 12px var(--acc-glow);}
.btn-action.ok{background:rgba(34,197,94,.12);border-color:var(--green);color:var(--green);}
.btn-close-result{
  background:none;border:1px solid var(--bdr);border-radius:6px;
  color:var(--txt3);padding:4px 9px;cursor:pointer;font-size:.8rem;
  transition:all .15s;
}
.btn-close-result:hover{border-color:var(--red);color:var(--red);}

@media(max-width:680px){
  .sidebar{width:220px;min-width:220px;}
  .grid{grid-template-columns:1fr 1fr;}
  .logo span{display:none;}
}
@media(max-width:500px){
  .app-body{flex-direction:column;}
  .sidebar{width:100%;min-width:0;border-right:none;border-bottom:1px solid var(--bdr);max-height:200px;}
  .cat-list{flex-direction:row;display:flex;overflow-x:auto;overflow-y:hidden;padding:4px 8px;gap:4px;}
  .cat-list::-webkit-scrollbar{height:3px;}
  .cat-item{padding:6px 10px;border-left:none;border-bottom:3px solid transparent;min-width:fit-content;font-size:.78rem;}
  .cat-item.active{border-bottom-color:var(--acc);border-left-color:transparent;}
  .cat-badge{display:none;}
  .grid{grid-template-columns:1fr;}
  #result-panel{max-height:60vh;}
}
</style>
</head>

function getCount(cat, level){
  return PRESETS_RAW.filter(p=>{
    const catOk = cat==='todos' || p.cat===cat;
    const lvlOk = level==='todos' || p.level===level;
    return catOk && lvlOk;
  }).length;
}

function renderSidebar(){
  const list = document.getElementById('cat-list');
  list.innerHTML = '';
  CATS.forEach(c=>{
    const count = getCount(c.key, currentLevel);
    const el = document.createElement('div');
    el.className = 'cat-item' + (currentCat===c.key ? ' active' : '');
    el.innerHTML = `<span class="cat-icon">${c.icon}</span><span class="cat-name">${c.name}</span><span class="cat-badge">${count}</span>`;
    el.onclick = ()=>{ currentCat=c.key; renderSidebar(); filterPresets(); };
    list.appendChild(el);
  });
}

function filterPresets(){
  const q = (document.getElementById('global-search').value||'').toLowerCase().trim();
  const filtered = PRESETS_RAW.filter(p=>{
    const catOk = currentCat==='todos' || p.cat===currentCat;
    const lvlOk = currentLevel==='todos' || p.level===currentLevel;
    const txtOk = !q || (p.name+' '+p.desc).toLowerCase().includes(q);
    return catOk && lvlOk && txtOk;
  });
  renderGrid(filtered);
}

function renderGrid(presets){
  const wrap = document.getElementById('grid-wrap');
  wrap.innerHTML = '';
  if(!presets.length){
    wrap.innerHTML = '<div class="no-results">Nenhum preset encontrado 🔍</div>';
    return;
  }
  // group by cat
  const groups = {};
  const catOrder = CATS.map(c=>c.key).filter(k=>k!=='todos');
  presets.forEach(p=>{
    if(!groups[p.cat]) groups[p.cat]=[]; groups[p.cat].push(p);
  });
  catOrder.forEach(catKey=>{
    if(!groups[catKey]) return;
    const catInfo = CATS.find(c=>c.key===catKey);
    const section = document.createElement('div');
    const title = document.createElement('div');
    title.className='section-title';
    title.textContent = (catInfo?catInfo.icon+' '+catInfo.name:catKey);
    section.appendChild(title);
    const grid = document.createElement('div');
    grid.className='grid';
    groups[catKey].forEach((p,i)=>{
      const card = document.createElement('div');
      card.className='card'+(selectedKey===p.key?' selected':'');
      card.dataset.key=p.key;
      card.style.setProperty('--i',i);
      const badgeClass = p.level==='sfw'?'badge-sfw':p.level==='sensual'?'badge-sensual':'badge-explicit';
      const badgeTxt = p.level==='sfw'?'☀ SFW':p.level==='sensual'?'🔥 Sensual':'🔞 Explícito';
      card.innerHTML=`<div class="card-icon">${p.icon||'📷'}</div><div class="card-name">${p.name}</div><div class="card-desc">${p.desc}</div><span class="card-badge ${badgeClass}">${badgeTxt}</span>`;
      card.onclick=()=>selectPreset(p.key);
      grid.appendChild(card);
    });
    section.appendChild(grid);
    wrap.appendChild(section);
  });
}

const DEFAULT_POSES = {
  casual:   'standing relaxed, weight on one hip, arms loose',
  praia:    'lying on towel, legs slightly bent, looking at camera',
  academia: 'mid-exercise, dynamic stance, muscles engaged',
  lingerie: 'sitting on edge of bed, legs crossed, looking over shoulder',
  banheiro: 'leaning against wall, towel loosely wrapped, steam around',
  boudoir:  'lying on side, head resting on hand, seductive look',
  nude:     'standing, arms above head, back slightly arched',
  fantasia: 'confident pose in costume, hands on hips',
  locais:   'leaning on wall or railing, relaxed and candid',
  explicito_suave: 'lying back, legs slightly open, hands on body',
  posicoes: 'on all fours, looking back at camera',
  extremo:  'submissive position, body fully exposed',
};
const DEFAULT_CAMS = {
  casual:   'eye level, 50mm, slight candid tilt',
  praia:    'low angle from sand level, wide shot',
  academia: 'side profile, 35mm, dynamic angle',
  lingerie: 'low angle POV, looking up at subject',
  banheiro: 'over-the-shoulder, mirror reflection, steamy',
  boudoir:  'top-down bird\'s eye, soft focus edges',
  nude:     'side silhouette, backlit, wide shot',
  fantasia: 'Dutch angle, dramatic low angle',
  locais:   'wide establishing shot, subject in foreground',
  explicito_suave: 'between-the-legs POV, low angle',
  posicoes: 'from behind, low angle close-up',
  extremo:  'extreme close-up POV, immersive angle',
};
function defaultPose(p){ return DEFAULT_POSES[p.cat] || 'natural standing pose, relaxed'; }
function defaultCam(p){  return DEFAULT_CAMS[p.cat]  || 'eye level, 50mm, natural framing'; }

function selectPreset(key){
  selectedKey = key;
  // update card highlight
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('selected',c.dataset.key===key));
  const p = PRESETS_RAW.find(x=>x.key===key);
  if(!p) return;
  const prompt = buildBlondePrompt(p);
  const neg = buildNeg(p);
  document.getElementById('result-title').textContent = '✅ '+p.name;
  document.getElementById('result-prompt').value = prompt;
  document.getElementById('result-neg').value = neg;
  document.getElementById('edit-pose').value = p.pose || defaultPose(p);
  document.getElementById('edit-cam').value  = p.cam  || defaultCam(p);
  const panel = document.getElementById('result-panel');
  panel.classList.add('open');
  panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function applyEdits(){
  const p = PRESETS_RAW.find(x=>x.key===selectedKey);
  if(!p) return;
  const overridePose = document.getElementById('edit-pose').value.trim();
  const overrideCam  = document.getElementById('edit-cam').value.trim();
  const merged = Object.assign({}, p,
    overridePose ? {pose: overridePose} : {},
    overrideCam  ? {cam:  overrideCam}  : {}
  );
  document.getElementById('result-prompt').value = buildBlondePrompt(merged);
  const btn = document.querySelector('.btn-apply');
  btn.textContent='✓ Aplicado!'; btn.style.background='var(--acc)'; btn.style.color='#000';
  setTimeout(()=>{ btn.textContent='↻ Aplicar ao Prompt'; btn.style.background=''; btn.style.color=''; },1800);
}

function closeResult(){
  document.getElementById('result-panel').classList.remove('open');
  selectedKey=null;
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));
}

function setLevel(lv){
  currentLevel=lv;
  ['todos','sfw','sensual','explicit'].forEach(l=>{
    const el=document.getElementById('pill-'+l);
    if(el) el.classList.toggle('active',l===lv);
  });
  renderSidebar();
  filterPresets();
}

function copyPrompt(){
  const ta=document.getElementById('result-prompt');
  navigator.clipboard.writeText(ta.value).then(()=>{
    const btn=document.getElementById('btn-copy-pos');
    btn.textContent='✓ Copiado!'; btn.classList.add('ok');
    setTimeout(()=>{ btn.innerHTML='📋 Copiar Prompt'; btn.classList.remove('ok'); },2000);
  });
}
function copyNeg(){
  const ta=document.getElementById('result-neg');
  navigator.clipboard.writeText(ta.value).then(()=>{
    const btn=document.getElementById('btn-copy-neg');
    btn.textContent='✓ Copiado!'; btn.classList.add('ok');
    setTimeout(()=>{ btn.innerHTML='🚫 Copiar Negativo'; btn.classList.remove('ok'); },2000);
  });
}
function downloadTxt(){
  const pos=document.getElementById('result-prompt').value;
  const neg=document.getElementById('result-neg').value;
  const name=selectedKey||'rawgen';
  const blob=new Blob([`POSITIVE:\n${pos}\n\nNEGATIVE:\n${neg}`],{type:'text/plain'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`${name}.txt`; a.click();
}
function variation(){
  const ta=document.getElementById('result-prompt');
  const seed=Math.floor(Math.random()*999999999);
  let v=ta.value.replace(/,\s*seed:\d+/,'');
  ta.value=v+', seed:'+seed;
  navigator.clipboard.writeText(ta.value);
}
function toggleTheme(){
  const html=document.documentElement;
  const dark=html.getAttribute('data-theme')==='dark';
  html.setAttribute('data-theme',dark?'light':'dark');
  document.getElementById('theme-btn').textContent=dark?'🌙 Escuro':'☀ Claro';
}

// ── START ──────────────────────────────────────────────────────────────────
renderSidebar();
filterPresets();
</script>
</body>
</html>
