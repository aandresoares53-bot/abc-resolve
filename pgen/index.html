<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RAWgen Loiras</title>
<meta name="theme-color" content="#e8a020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#080808;--surface:#111116;--surface2:#18181f;--surface3:#1e1e28;
  --bdr:#252530;--bdr2:#2e2e3a;
  --acc:#e8a020;--acc2:#f0b840;--acc-glow:rgba(232,160,32,.18);
  --txt:#ededf0;--txt2:#7a7a8a;--txt3:#44445a;
  --green:#22c55e;--red:#ef4444;--orange:#f59e0b;
  --r:14px;--r2:9px;--sidebar:270px;
}
[data-theme="light"]{
  --bg:#f2ede4;--surface:#fff;--surface2:#f5f0e8;--surface3:#ede8de;
  --bdr:#ddd6c8;--bdr2:#ccc4b4;
  --txt:#141414;--txt2:#666;--txt3:#aaa;
}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;}
body{background:var(--bg);color:var(--txt);display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* ── HEADER ── */
header{
  flex-shrink:0;display:flex;align-items:center;gap:12px;
  padding:9px 16px;border-bottom:1px solid var(--bdr);
  background:var(--surface);z-index:20;
  box-shadow:0 1px 0 var(--bdr2);
}
.logo{font-size:1.1rem;font-weight:900;color:var(--acc);letter-spacing:-0.5px;white-space:nowrap;
  text-shadow:0 0 20px var(--acc-glow);}
.logo span{color:var(--txt3);font-weight:400;font-size:.78em;margin-left:5px;}
.header-search{
  flex:1;background:var(--bg);border:1px solid var(--bdr);
  border-radius:var(--r2);color:var(--txt);padding:7px 13px;
  font-size:.85rem;font-family:inherit;outline:none;max-width:440px;
  transition:border-color .2s,box-shadow .2s;
}
.header-search:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-glow);}
.header-search::placeholder{color:var(--txt3);}
.hbtn{
  background:var(--surface2);border:1px solid var(--bdr);
  color:var(--txt2);border-radius:var(--r2);padding:6px 12px;
  cursor:pointer;font-size:.75rem;font-weight:600;white-space:nowrap;
  transition:all .15s;font-family:inherit;
}
.hbtn-random{background:var(--acc);border-color:var(--acc);color:#000;font-weight:700;}
.hbtn-random:hover{background:var(--acc2);box-shadow:0 2px 10px var(--acc-glow);}
.hbtn:hover{border-color:var(--acc);color:var(--acc);background:var(--surface3);}

/* ── LAYOUT ── */
.app-body{display:flex;flex:1;overflow:hidden;}

/* ── SIDEBAR ── */
.sidebar{
  width:var(--sidebar);min-width:var(--sidebar);
  border-right:1px solid var(--bdr);background:var(--surface);
  display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;
}
.level-pills{
  display:flex;gap:5px;padding:10px 11px;border-bottom:1px solid var(--bdr);flex-wrap:wrap;
}
.pill{
  background:var(--surface2);border:1px solid var(--bdr);
  border-radius:20px;color:var(--txt2);font-size:.68rem;font-weight:700;
  padding:4px 11px;cursor:pointer;transition:all .15s;white-space:nowrap;
  letter-spacing:.02em;
}
.pill:hover{border-color:var(--acc);color:var(--acc);background:var(--surface3);}
.pill.active{border-color:var(--acc);color:var(--acc);background:var(--acc-glow);
  box-shadow:0 0 8px var(--acc-glow);}
.cat-list{flex:1;overflow-y:auto;padding:6px 0;}
.cat-list::-webkit-scrollbar{width:3px;}
.cat-list::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:2px;}
.cat-item{
  display:flex;align-items:center;gap:9px;
  padding:8px 14px;cursor:pointer;transition:background .15s,border-color .15s;
  font-size:.83rem;border-left:3px solid transparent;
}
.cat-item:hover{background:var(--surface2);}
.cat-item.active{background:var(--acc-glow);border-left-color:var(--acc);color:var(--acc);}
.cat-icon{font-size:.95rem;width:20px;text-align:center;flex-shrink:0;}
.cat-name{flex:1;font-weight:600;}
.cat-badge{
  background:var(--surface3);border:1px solid var(--bdr2);
  border-radius:20px;color:var(--txt3);font-size:.62rem;
  font-weight:700;padding:1px 7px;
}
.cat-item.active .cat-badge{border-color:rgba(232,160,32,.5);color:var(--acc);}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.grid-wrap{flex:1;overflow-y:auto;padding:14px;}
.grid-wrap::-webkit-scrollbar{width:4px;}
.grid-wrap::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px;}
.section-title{
  font-size:.66rem;font-weight:800;color:var(--txt3);
  text-transform:uppercase;letter-spacing:.1em;
  margin:4px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--bdr);
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(195px,1fr));
  gap:9px;margin-bottom:18px;
}
.card{
  background:var(--surface);border:1px solid var(--bdr);
  border-radius:var(--r);padding:13px 14px;cursor:pointer;
  transition:border-color .18s,transform .18s,box-shadow .18s,background .18s;
  position:relative;animation:fadeUp .3s ease both;
  animation-delay:calc(var(--i,0) * 18ms);
}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.card:hover{
  border-color:var(--acc);transform:translateY(-3px);
  box-shadow:0 6px 24px rgba(232,160,32,.12),0 1px 4px rgba(0,0,0,.4);
  background:var(--surface2);
}
.card.selected{
  border-color:var(--acc);background:var(--acc-glow);
  box-shadow:0 0 0 1px var(--acc),0 6px 24px rgba(232,160,32,.15);
}
.card-icon{font-size:1.5rem;margin-bottom:7px;line-height:1;}
.card-name{font-size:.83rem;font-weight:700;line-height:1.3;margin-bottom:4px;}
.card-desc{font-size:.72rem;color:var(--txt2);line-height:1.45;}
.card-badge{
  display:inline-block;margin-top:8px;
  border-radius:20px;font-size:.6rem;font-weight:700;
  padding:2px 8px;border:1px solid;letter-spacing:.03em;
}
.badge-sfw{color:var(--green);border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.07);}
.badge-sensual{color:var(--orange);border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.07);}
.badge-explicit{color:var(--red);border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.07);}

.no-results{
  text-align:center;padding:60px 20px;color:var(--txt3);
  font-size:.88rem;
}

/* ── RESULT PANEL ── */
#result-panel{
  flex-shrink:0;border-top:2px solid var(--acc);
  background:var(--surface);display:none;
  max-height:52vh;overflow-y:auto;
  box-shadow:0 -4px 24px rgba(0,0,0,.4);
}
#result-panel.open{display:block;}
.result-header{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;border-bottom:1px solid var(--bdr);
  position:sticky;top:0;background:var(--surface);z-index:5;
  backdrop-filter:blur(4px);
}
.result-title{font-size:.85rem;font-weight:700;color:var(--acc);flex:1;
  text-shadow:0 0 12px var(--acc-glow);}
.result-body{padding:12px 16px;display:grid;gap:10px;}
.result-label{font-size:.65rem;font-weight:800;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
.edit-fields{background:var(--surface2);border:1px solid var(--bdr);border-radius:var(--r2);padding:12px;display:grid;gap:8px;}
.edit-field{display:grid;gap:4px;}
.edit-label{font-size:.65rem;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.06em;}
.chip-group{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.chip{background:var(--surface2);border:1px solid var(--bdr2);border-radius:20px;color:var(--txt2);padding:4px 10px;font-size:.72rem;font-family:inherit;cursor:pointer;transition:all .15s;white-space:nowrap;}
.chip:hover{border-color:var(--acc);color:var(--acc);}
.chip.active{background:var(--acc);border-color:var(--acc);color:#000;font-weight:700;}
.chip-section{font-size:.65rem;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;width:100%;margin-top:4px;}
.edit-select:focus{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-glow);}
.edit-select option,.edit-select optgroup{background:var(--surface2);color:var(--txt);}
.btn-apply{background:var(--surface3);border:1px solid var(--bdr2);border-radius:var(--r2);color:var(--acc);font-size:.75rem;font-weight:700;padding:7px 14px;cursor:pointer;transition:background .2s,border-color .2s;width:fit-content;}
.btn-apply:hover{background:var(--acc);color:#000;border-color:var(--acc);}
.result-ta{
  width:100%;background:var(--bg);border:1px solid var(--bdr);
  border-radius:var(--r2);color:var(--txt);padding:10px 12px;
  font-size:.78rem;font-family:monospace;line-height:1.55;
  resize:vertical;outline:none;transition:border-color .2s,box-shadow .2s;
  min-height:80px;
}
.result-ta:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-glow);}
.result-ta.neg{min-height:58px;color:var(--txt2);font-size:.71rem;}
.btn-row{display:flex;gap:7px;flex-wrap:wrap;}
.btn-action{
  background:var(--surface2);border:1px solid var(--bdr);
  color:var(--txt2);border-radius:var(--r2);padding:7px 14px;
  cursor:pointer;font-size:.75rem;font-weight:600;
  transition:all .15s;font-family:inherit;white-space:nowrap;
}
.btn-action:hover{border-color:var(--acc);color:var(--acc);background:var(--surface3);}
.btn-action.primary{background:var(--acc);border-color:var(--acc);color:#000;font-weight:700;}
.btn-action.primary:hover{background:var(--acc2);box-shadow:0 2px 12px var(--acc-glow);}
.btn-action.ok{background:rgba(34,197,94,.12);border-color:var(--green);color:var(--green);}
.btn-close-result{
  background:none;border:1px solid var(--bdr);border-radius:6px;
  color:var(--txt3);padding:4px 9px;cursor:pointer;font-size:.8rem;
  transition:all .15s;
}
.btn-close-result:hover{border-color:var(--red);color:var(--red);}

/* ── QUICK PICKS ── */
.qrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:8px 14px 0;}
.qlabel{font-size:.85rem;min-width:20px;}
.qpick{
  background:var(--surface2);border:1px solid var(--bdr);border-radius:20px;
  color:var(--txt2);font-size:.7rem;font-weight:600;padding:4px 11px;cursor:pointer;
  transition:background .15s,border-color .15s,color .15s;white-space:nowrap;
}
.qpick:hover{background:var(--surface3);color:var(--txt);}
.qpick.active{background:var(--acc);border-color:var(--acc);color:#000;}

/* ── FAV BTN ── */
.fav-btn{
  position:absolute;top:8px;right:8px;background:none;border:none;
  font-size:.95rem;cursor:pointer;opacity:.3;transition:opacity .15s,transform .15s;
  padding:2px;line-height:1;
}
.fav-btn:hover{opacity:1;transform:scale(1.2);}
.fav-btn.active{opacity:1;}

/* ── MODAL ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-box{
  background:var(--surface);border:1px solid var(--bdr);border-radius:var(--r);
  width:min(560px,95vw);max-height:80vh;display:flex;flex-direction:column;
  box-shadow:0 24px 80px rgba(0,0,0,.6);
}
.modal-header{
  display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--bdr);flex-shrink:0;
}
.modal-header h3{flex:1;font-size:.9rem;font-weight:700;color:var(--acc);}
.modal-close{background:none;border:1px solid var(--bdr);border-radius:6px;
  color:var(--txt3);padding:3px 8px;cursor:pointer;font-size:.8rem;}
.modal-close:hover{border-color:var(--red);color:var(--red);}
.modal-body{overflow-y:auto;padding:10px 14px;display:grid;gap:6px;}
.modal-body::-webkit-scrollbar{width:3px;}
.modal-body::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:2px;}
.hist-item{
  background:var(--surface2);border:1px solid var(--bdr);border-radius:var(--r2);
  padding:9px 12px;display:flex;align-items:center;gap:8px;
}
.hist-info{flex:1;min-width:0;}
.hist-name{font-size:.75rem;font-weight:700;color:var(--acc);margin-bottom:2px;}
.hist-text{font-size:.68rem;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hist-copy{background:var(--surface3);border:1px solid var(--bdr2);border-radius:6px;
  color:var(--txt2);padding:4px 9px;cursor:pointer;font-size:.7rem;white-space:nowrap;flex-shrink:0;}
.hist-copy:hover{border-color:var(--acc);color:var(--acc);}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--acc);color:#000;font-weight:700;font-size:.78rem;
  padding:8px 20px;border-radius:20px;pointer-events:none;
  opacity:0;transition:opacity .2s,transform .2s;z-index:200;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── ROULETTE BTN ── */
.hbtn-roulette.active{background:var(--red);border-color:var(--red);color:#fff;}

@media(max-width:680px){
  .sidebar{width:220px;min-width:220px;}
  .grid{grid-template-columns:1fr 1fr;}
  .logo span{display:none;}
}
@media(max-width:500px){
  .app-body{flex-direction:column;}
  .sidebar{width:100%;min-width:0;border-right:none;border-bottom:1px solid var(--bdr);max-height:200px;}
  .cat-list{flex-direction:row;display:flex;overflow-x:auto;overflow-y:hidden;padding:4px 8px;gap:4px;}
  .cat-list::-webkit-scrollbar{height:3px;}
  .cat-item{padding:6px 10px;border-left:none;border-bottom:3px solid transparent;min-width:fit-content;font-size:.78rem;}
  .cat-item.active{border-bottom-color:var(--acc);border-left-color:transparent;}
  .cat-badge{display:none;}
  .grid{grid-template-columns:1fr;}
  #result-panel{max-height:60vh;}
}
</style>
</head>
<body>

<header>
  <div class="logo">RAWgen Loiras <span>🔞 preset browser</span></div>
  <button class="hbtn hbtn-random" onclick="randomPreset()">🎲 Aleatório</button>
  <button class="hbtn" onclick="toggleHistorico()" id="hist-btn">📜 Histórico</button>
  <button class="hbtn hbtn-roulette" onclick="toggleRoulette()" id="roulette-btn">🎰 Roulette</button>
  <input class="header-search" id="global-search" placeholder="🔍 Buscar preset…" oninput="filterPresets()" autocomplete="off">
  <button class="hbtn" onclick="toggleTheme()" id="theme-btn">☀ Claro</button>
</header>

<!-- Modal Histórico -->

  <div class="modal-box">
    <div class="modal-header">
      <h3>📜 Histórico de Prompts</h3>
      <button class="modal-close" onclick="toggleHistorico()">✕ Fechar</button>
    </div>
    <div class="modal-body" id="modal-hist-body"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<div class="app-body">
  <!-- Sidebar -->
  <aside class="sidebar">

      <button class="pill active" id="pill-todos" onclick="setLevel('todos')">Todos</button>
      <button class="pill" id="pill-sfw" onclick="setLevel('sfw')">☀ SFW</button>
      <button class="pill" id="pill-sensual" onclick="setLevel('sensual')">🔥 Sensual</button>
      <button class="pill" id="pill-explicit" onclick="setLevel('explicit')">🔞 Explícito</button>
    </div>
    <nav class="cat-list" id="cat-list"></nav>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="grid-wrap" id="grid-wrap"></div>

    <!-- Result Panel -->
    <div id="result-panel">

      <div class="result-body">

        <!-- Pose row -->

          <button class="qpick" data-group="pose" data-val="sitting on edge of bed, legs crossed, hands on knees">Sentada</button>

          <button class="qpick" data-group="pose" data-val="kneeling on floor, sitting back on heels, hands on thighs">Ajoelhada</button>
          <button class="qpick" data-group="pose" data-val="squatting low, knees wide, arms between legs">Agachada</button>
        </div>

        <!-- Camera row -->
        <div class="qrow">
          <span class="qlabel">📷</span>
          <button class="qpick active" data-group="cam" data-val="">Padrão</button>
          <button class="qpick" data-group="cam" data-val="eye level, 50mm, natural framing, slight candid tilt">50mm</button>
          <button class="qpick" data-group="cam" data-val="eye level, portrait framing, 85mm, shallow depth of field">85mm</button>
          <button class="qpick" data-group="cam" data-val="full body shot, head to toe, environmental portrait, 28mm wide">Corpo inteiro</button>
          <button class="qpick" data-group="cam" data-val="low angle POV, looking up at subject from below">POV baixo</button>
          <button class="qpick" data-group="cam" data-val="worm's eye view, ultra low angle, camera on floor looking straight up, towering figure above">POV baixo extremo</button>
          <button class="qpick" data-group="cam" data-val="POV shot, first person perspective, intimate and direct">POV 1ª</button>
          <button class="qpick" data-group="cam" data-val="extreme close-up, face and eyes filling frame">Close</button>
          <button class="qpick" data-group="cam" data-val="mirror reflection shot, dual perspective, bathroom mirror">Espelho</button>
          <button class="qpick" data-group="cam" data-val="side profile, silhouette against bright background">Perfil</button>
          <button class="qpick" data-group="cam" data-val="high angle, camera above looking down, vulnerable feel">Alto</button>
        </div>

        <!-- hidden inputs for JS compatibility -->
        <input type="hidden" id="edit-pose" value="">
        <input type="hidden" id="edit-cam" value="">

        <!-- Prompt -->

          <textarea class="result-ta neg" id="result-neg" rows="2" readonly style="display:none"></textarea>
          <div class="btn-row" style="margin-top:6px">
            <button class="btn-action primary" id="btn-copy-pos" onclick="copyPrompt()">📋 Copiar</button>
            <button class="btn-action" onclick="variation()">🔀 Variação</button>
            <button class="btn-action" onclick="randomPreset()">🎲 Aleatório</button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
// ── MIDJOURNEY CONFIG ───────────────────────────────────────────────────────
const DEFAULT_SEED = 419528731;

// Midjourney --no (negative) base
const MJ_NO = 'plastic skin, smooth skin, airbrushed, beauty filter, retouched, CGI, 3d render, cartoon, anime, illustration, perfect skin, porcelain skin, silicone, doll, mannequin, digital art, watermark, text, ugly, deformed, extra limbs, flawless complexion, smooth complexion, glossy skin, skin retouching, post-processing, enhanced skin, overly smooth, studio lighting, professional retouching, face tune, beauty app filter, render, digital painting, concept art, artwork, drawing, sketch, makeup, cosmetics, lipstick, eyeshadow, foundation, blush, mascara, beauty product, perfect body, idealized body, fashion model, supermodel, flawless body, perfect symmetry, symmetrical face, perfect proportions, editorial, high fashion, vogue, magazine shoot, model pose, model body, goddess, perfect figure';

// Midjourney suffix parameters
const MJ_PARAMS = '--ar 2:3 --v 6.1 --style raw --chaos 20 --weird 250 --seed ' + DEFAULT_SEED;

// Subject base (Midjourney plain language, no weights)
const MJ_SUBJECT = 'real photograph of a woman, 19 years old, long messy wavy blonde hair, loose tangled blonde waves falling past shoulders, light blue eyes, small straight nose, full natural lips, defined cheekbones, heart-shaped face, fit athletic body, toned flat abs, medium natural breasts, round firm full buttocks, shapely hips, slim waist, toned legs, skin with visible pores, slight natural blemishes, realistic human skin texture, NOT retouched, NOT airbrushed, authentic candid person';

function buildNeg(p){
  let neg = MJ_NO;
  if(p && /nude|naked|pelada|sem roupa|topless/i.test(p.roupa||'')) neg += ', clothed, dressed';
  return neg;
}

function buildBlondePrompt(p, seedOverride){
  // Dynamic seed each call; caller can pass a fixed seed (for applyEdits)
  const seed = seedOverride !== undefined ? seedOverride : DEFAULT_SEED;

  desc.push(MJ_SUBJECT);

  const neg = buildNeg(p);

let currentCat = 'todos';

function getCount(cat, level){
  return PRESETS_RAW.filter(p=>{
    const catOk = cat==='todos' || (cat==='favoritos' ? FAVS.includes(p.key) : p.cat===cat);
    const lvlOk = level==='todos' || p.level===level;
    return catOk && lvlOk;
  }).length;
}

function renderSidebar(){
  const list = document.getElementById('cat-list');
  list.innerHTML = '';
  CATS.forEach(c=>{
    const count = getCount(c.key, currentLevel);
    const el = document.createElement('div');
    el.className = 'cat-item' + (currentCat===c.key ? ' active' : '');
    el.innerHTML = `<span class="cat-icon">${c.icon}</span><span class="cat-name">${c.name}</span><span class="cat-badge">${count}</span>`;
    el.onclick = ()=>{ currentCat=c.key; renderSidebar(); filterPresets(); };
    list.appendChild(el);
  });
}

function filterPresets(){
  const q = (document.getElementById('global-search').value||'').toLowerCase().trim();
  const filtered = PRESETS_RAW.filter(p=>{
    const catOk = currentCat==='todos' || (currentCat==='favoritos' ? FAVS.includes(p.key) : p.cat===currentCat);
    const lvlOk = currentLevel==='todos' || p.level===currentLevel;
    const txtOk = !q || (p.name+' '+p.desc).toLowerCase().includes(q);
    return catOk && lvlOk && txtOk;
  });
  renderGrid(filtered);
}

function renderGrid(presets){
  const wrap = document.getElementById('grid-wrap');
  wrap.innerHTML = '';
  if(!presets.length){
    wrap.innerHTML = '<div class="no-results">Nenhum preset encontrado 🔍</div>';
    return;
  }
  // group by cat
  const groups = {};
  const catOrder = CATS.map(c=>c.key).filter(k=>k!=='todos');
  presets.forEach(p=>{
    if(!groups[p.cat]) groups[p.cat]=[]; groups[p.cat].push(p);
  });
  catOrder.forEach(catKey=>{
    if(!groups[catKey]) return;
    const catInfo = CATS.find(c=>c.key===catKey);
    const section = document.createElement('div');
    const title = document.createElement('div');
    title.className='section-title';
    title.textContent = (catInfo?catInfo.icon+' '+catInfo.name:catKey);
    section.appendChild(title);
    const grid = document.createElement('div');
    grid.className='grid';
    groups[catKey].forEach((p,i)=>{
      const card = document.createElement('div');
      card.className='card'+(selectedKey===p.key?' selected':'');
      card.dataset.key=p.key;
      card.style.setProperty('--i',i);
      const badgeClass = p.level==='sfw'?'badge-sfw':p.level==='sensual'?'badge-sensual':'badge-explicit';
      const badgeTxt = p.level==='sfw'?'☀ SFW':p.level==='sensual'?'🔥 Sensual':'🔞 Explícito';
      const isFav = FAVS.includes(p.key);
      card.innerHTML=`<button class="fav-btn${isFav?' active':''}" data-key="${p.key}" title="Favorito">❤</button><div class="card-icon">${p.icon||'📷'}</div><div class="card-name">${p.name}</div><div class="card-desc">${p.desc}</div><span class="card-badge ${badgeClass}">${badgeTxt}</span>`;
      card.onclick=()=>selectPreset(p.key);
      grid.appendChild(card);
    });
    section.appendChild(grid);
    wrap.appendChild(section);
  });
}

function selectChip(group, val){
  document.querySelectorAll(`.chip[data-group="${group}"]`).forEach(c=>{
    c.classList.toggle('active', c.dataset.val===val);
  });
  // sync quick picks (Padrão active when val empty)
  document.querySelectorAll(`.qpick[data-group="${group}"]`).forEach(b=>{
    b.classList.toggle('active', b.dataset.val===(val||'') && (b.dataset.val==='' ? !val : b.dataset.val===val));
  });
  const inp = document.getElementById('edit-'+group);
  if(inp) inp.value = val||'';
  // Auto-apply: update prompt immediately when chip changes
  if(selectedKey) applyEdits(true);
}
function setSelectClosest(id, val){
  const group = id.replace('edit-','');
  selectChip(group, val||'');
}
// chip click handler (delegated)
document.addEventListener('click', e=>{
  const c = e.target.closest('.chip[data-group]');
  if(!c) return;
  const group = c.dataset.group;
  const already = c.classList.contains('active');
  selectChip(group, already ? '' : c.dataset.val);
});

// quick-pick click handler
document.addEventListener('click', e=>{
  const q = e.target.closest('.qpick[data-group]');
  if(!q) return;
  const group = q.dataset.group;
  const val = q.dataset.val;
  // toggle active on qpick buttons in this group
  document.querySelectorAll(`.qpick[data-group="${group}"]`).forEach(b=>b.classList.toggle('active', b===q && val!==''));
  // sync with hidden input and full chips
  selectChip(group, val);
});

function selectPreset(key){
  selectedKey = key;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('selected',c.dataset.key===key));
  const p = PRESETS_RAW.find(x=>x.key===key);
  if(!p) return;
  const prompt = buildBlondePrompt(p);
  document.getElementById('result-title').textContent = '✅ '+p.name;
  document.getElementById('result-prompt').value = prompt;
  const negMatch = prompt.match(/--no\s+(.+?)\s+--ar/);
  if(negMatch) document.getElementById('result-neg').value = negMatch[1];
  setSelectClosest('edit-pose', p.pose || defaultPose(p));
  setSelectClosest('edit-cam',  p.cam  || defaultCam(p));
  const panel = document.getElementById('result-panel');
  panel.classList.add('open');
  panel.scrollIntoView({behavior:'smooth',block:'nearest'});
  // Auto-copy
  navigator.clipboard.writeText(prompt).catch(()=>{});
  showToast('✓ Copiado automaticamente');
  // Save to history
  saveHistory(p.key, p.name, prompt);
}

function refreshCref(){
  if(selectedKey) {

      const curVal = document.getElementById('result-prompt').value;

function applyEdits(silent){
  const p = PRESETS_RAW.find(x=>x.key===selectedKey);
  if(!p) return;
  const overridePose = document.getElementById('edit-pose').value.trim();
  const overrideCam  = document.getElementById('edit-cam').value.trim();
  const merged = Object.assign({}, p,
    overridePose ? {pose: overridePose} : {},
    overrideCam  ? {cam:  overrideCam}  : {}
  );
  // Preserve current seed
  const curVal = document.getElementById('result-prompt').value;
  const seedMatch = curVal.match(/--seed\s+(\d+)/);
  const seed = seedMatch ? parseInt(seedMatch[1]) : undefined;
  const newPrompt = buildBlondePrompt(merged, seed);
  document.getElementById('result-prompt').value = newPrompt;
  const negM = newPrompt.match(/--no\s+(.+?)\s+--ar/);
  if(negM) document.getElementById('result-neg').value = negM[1];
  navigator.clipboard.writeText(newPrompt).catch(()=>{});
  if(!silent) showToast('✓ Copiado!');
}

        </div>
        <button class="hist-copy" onclick="copyHistItem(${i})">📋 Copiar</button>
      </div>`).join('');
  }
  overlay.classList.add('open');
}
function copyHistItem(i){
  try{
    const hist = JSON.parse(localStorage.getItem('pgen_history')||'[]');
    if(hist[i]) navigator.clipboard.writeText(hist[i].prompt).then(()=>showToast('✓ Copiado!'));
  }catch(e){}
}
// Close modal clicking overlay background
document.getElementById('modal-hist').addEventListener('click', function(e){
  if(e.target===this) this.classList.remove('open');
});

// ── TOAST ──────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

// ── ROULETTE ───────────────────────────────────────────────────────────────
let rouletteTimer = null;
let rouletteCount = 0;
function toggleRoulette(){
  const btn = document.getElementById('roulette-btn');
  if(rouletteTimer){
    clearInterval(rouletteTimer);
    rouletteTimer = null;
    btn.textContent = '🎰 Roulette';
    btn.classList.remove('active');
  } else {
    btn.classList.add('active');
    rouletteCount = 3;
    btn.textContent = `⏹ Parar (${rouletteCount}s)`;
    rouletteTimer = setInterval(()=>{
      rouletteCount--;
      if(rouletteCount<=0){
        randomPreset();
        rouletteCount=3;
      }
      if(rouletteTimer) btn.textContent = `⏹ Parar (${rouletteCount}s)`;
    },1000);
  }
}

// ── KEYBOARD SHORTCUTS ─────────────────────────────────────────────────────
document.addEventListener('keydown', e=>{
  if(e.target.matches('input,textarea,select')) return;
  if(e.key===' '||e.code==='Space'){ e.preventDefault(); randomPreset(); }
  if(e.key==='c'||e.key==='C'){ copyPrompt(); }
  if(e.key==='v'||e.key==='V'){ variation(); }
  if(e.key==='Escape'){ closeResult(); document.getElementById('modal-hist').classList.remove('open'); }
  if(e.key==='h'||e.key==='H'){ toggleHistorico(); }
  if(e.key==='f'||e.key==='F'){ currentCat='favoritos'; renderSidebar(); filterPresets(); }
});

// ── DELEGATE FAV BTN CLICKS ─────────────────────────────────────────────────
document.addEventListener('click', e=>{
  const fb = e.target.closest('.fav-btn');
  if(fb){ toggleFav(fb.dataset.key, e); }
});

// ── START ──────────────────────────────────────────────────────────────────
renderSidebar();
filterPresets();
</script>
</body>
</html>
