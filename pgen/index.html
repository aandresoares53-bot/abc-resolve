header{

.hbtn{background:transparent;border:1px solid var(--bdr);color:var(--txt2);border-radius:var(--r2);padding:5px 9px;cursor:pointer;font-size:0.72em;font-weight:600;transition:all .15s;white-space:nowrap;}

.hbtn.active{border-color:var(--acc);color:var(--acc);background:rgba(232,160,32,.1);}

/* ── Progress bar ── */
#progress-bar{
  flex-shrink:0;height:3px;background:var(--bdr);
  transition:none;
}
#progress-fill{height:100%;background:var(--acc);width:0%;transition:width .4s ease;}

/* ── Progress label ── */
#progress-label{
  flex-shrink:0;
  font-size:0.68em;color:var(--txt3);

.msg{display:flex;gap:9px;max-width:84%;animation:fadeUp .25s ease;}

.msg.usr{align-self:flex-end;flex-direction:row-reverse;}

.usr .avatar{background:#333;color:#aaa;}

.bot .bubble{background:var(--bot-bg);border:1px solid var(--bdr);border-bottom-left-radius:4px;}
.usr .bubble{background:var(--usr-bg);color:#000;font-weight:600;border-bottom-right-radius:4px;}

.dot-row{display:flex;gap:4px;align-items:center;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--txt3);animation:bounce .9s infinite;}
.dot:nth-child(2){animation-delay:.15s;}
.dot:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0);}40%{transform:translateY(-5px);}}

.summary-card{
  background:var(--bg);border:1px solid var(--bdr);border-radius:var(--r2);

.sc-edit{background:none;border:none;color:var(--acc);cursor:pointer;font-size:.8em;padding:0 0 0 6px;flex-shrink:0;}

.copy-btn{

.copy-btn.neg.ok{background:var(--green);color:#fff;}

  background:transparent;border:1px solid var(--bdr);color:var(--txt3);border-radius:var(--r2);

.hist-item{

  chat.appendChild(d); scrollBottom();
}
function removeTyping(){ const t=document.getElementById('typing'); if(t) t.remove(); }

function setQR(chips){
  qrArea.innerHTML='';
  chips.forEach(({label,val,skip,cls})=>{
    const btn=document.createElement('button');
    btn.className='qr'+(skip?' skip':'')+(cls?' '+cls:'');
    btn.textContent=label;
    btn.onclick=()=>handleQR(val!=null?val:label, label);
    qrArea.appendChild(btn);
  });
}
function clearQR(){ qrArea.innerHTML=''; }

function handleQR(val, label){
  if(waiting) return;
  addMsg('usr', label);
  processAnswer(val);
}

function send(){
  const txt=input.value.trim();
  if(!txt||waiting) return;
  input.value=''; input.style.height='';
  addMsg('usr', escHtml(txt));
  processAnswer(txt);
}

function handleKey(e){
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); }
}

function autoResize(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,120)+'px';
}

function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function delay(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function botSay(html, qrs=[]){
  waiting=true;
  showTyping();
  await delay(550+Math.random()*250);
  removeTyping();
  addMsg('bot', html);
  setQR(qrs);
  waiting=false;
  input.focus();
}

async function processAnswer(val){
  const cur=STEPS[step];
  if(!cur) return;
  const isSkip=/^(pular|skip|não|nao|-)$/i.test(val.trim()) || val==='';
  if(!isSkip) answers[cur.id]=val;
  step++;
  clearQR();
  updateProgress();
  if(step < STEPS.length){
    const next=STEPS[step];
    const qrs=next.qr?[...next.qr]:[];
    if(next.skip) qrs.push({label:'Pular →',val:'pular',skip:true});
    if(step>0) qrs.push({label:'← Voltar',val:'__back__',cls:'back'});
    await botSay(next.ask, qrs);
  } else {
    await showSummary();
  }
}

async function goBack(){
  if(step<=0) return;
  step--;
  delete answers[STEPS[step].id];
  clearQR();
  updateProgress();
  const cur=STEPS[step];
  const qrs=cur.qr?[...cur.qr]:[];
  if(cur.skip) qrs.push({label:'Pular →',val:'pular',skip:true});
  if(step>0) qrs.push({label:'← Voltar',val:'__back__',cls:'back'});
  await botSay('↩ Voltando — '+cur.ask, qrs);
}

// ─── Summary before generating ────────────────────────────────────────────
async function showSummary(){
  waiting=true;
  showTyping();
  await delay(700);
  removeTyping();

  const b=addMsg('bot','📋 <strong>Resumo das suas escolhas:</strong>');

  const card=document.createElement('div');
  card.className='summary-card';

  STEPS.forEach(s=>{
    const val=answers[s.id];
    if(!val) return;
    const row=document.createElement('div');
    row.className='sc-row';
    const short=val.length>60?val.slice(0,57)+'…':val;
    row.innerHTML=`<span class="sc-key">${s.label}</span><span class="sc-val">${escHtml(short)}</span>`;
    const editBtn=document.createElement('button');
    editBtn.className='sc-edit';
    editBtn.textContent='✏';
    editBtn.title='Editar este passo';
    editBtn.onclick=()=>jumpTo(s.id);
    row.appendChild(editBtn);
    card.appendChild(row);
  });
  b.appendChild(card);

  const genBtn=document.createElement('button');
  genBtn.className='copy-btn';
  genBtn.style.marginTop='10px';
  genBtn.innerHTML='✅ Gerar prompt';
  genBtn.onclick=()=>{ b.parentElement && chat.removeChild(b.parentElement); clearQR(); showResult(); };
  b.appendChild(genBtn);

  const editBtn=document.createElement('button');
  editBtn.className='icon-btn';
  editBtn.style.marginTop='10px';
  editBtn.innerHTML='✏ Editar respostas';
  editBtn.onclick=()=>jumpTo(STEPS[0].id);
  b.appendChild(editBtn);

  scrollBottom();
  setQR([{label:'✅ Gerar prompt',val:'__gen__'}]);
  qrArea.querySelector('.qr').onclick=()=>{ clearQR(); showResult(); };
  waiting=false;
}

async function jumpTo(id){
  const idx=STEPS.findIndex(s=>s.id===id);
  if(idx<0) return;
  step=idx;
  clearQR();
  updateProgress();
  const cur=STEPS[step];
  const qrs=cur.qr?[...cur.qr]:[];
  if(cur.skip) qrs.push({label:'Pular →',val:'pular',skip:true});
  if(step>0) qrs.push({label:'← Voltar',val:'__back__',cls:'back'});
  await botSay('✏ Editando: '+cur.ask, qrs);
}

// ─── Show result ──────────────────────────────────────────────────────────
async function showResult(){
  waiting=true;
  showTyping();
  await delay(800);
  removeTyping();

  const prompt=buildPrompt();
  const neg=buildNeg();

  navigator.clipboard.writeText(prompt).catch(()=>{});
  saveToHistory(prompt, neg);

  const b=addMsg('bot','✅ <strong>Prompt copiado automaticamente!</strong> Cole direto no gerador:');

  const pd=document.createElement('div');
  pd.className='prompt-block';
  pd.title='Clique para selecionar tudo';
  pd.textContent=prompt;
  pd.onclick=()=>{ const r=document.createRange();r.selectNodeContents(pd);const s=window.getSelection();s.removeAllRanges();s.addRange(r); };
  b.appendChild(pd);

  const btnRow=document.createElement('div');
  btnRow.className='btn-row';

  const copyBtn=document.createElement('button');
  copyBtn.className='copy-btn';
  copyBtn.innerHTML='📋 Copiar prompt';
  copyBtn.onclick=()=>{
    navigator.clipboard.writeText(prompt).then(()=>{
      copyBtn.textContent='✓ Copiado!'; copyBtn.classList.add('ok');
      setTimeout(()=>{ copyBtn.innerHTML='📋 Copiar prompt'; copyBtn.classList.remove('ok'); },2000);
    });
  };
  btnRow.appendChild(copyBtn);

  const dlBtn=document.createElement('button');
  dlBtn.className='icon-btn';
  dlBtn.innerHTML='💾 Baixar .txt';
  dlBtn.onclick=()=>{
    const blob=new Blob([`POSITIVE PROMPT:\n${prompt}\n\nNEGATIVE PROMPT:\n${neg}`],{type:'text/plain'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='rawgen-prompt.txt';
    a.click();
  };
  btnRow.appendChild(dlBtn);

  const shareBtn=document.createElement('button');
  shareBtn.className='icon-btn';
  shareBtn.innerHTML='🔗 Link';
  shareBtn.onclick=()=>{
    const params=new URLSearchParams();
    Object.entries(answers).forEach(([k,v])=>v&&params.set(k,v));
    const url=location.origin+location.pathname+'?'+params.toString();
    navigator.clipboard.writeText(url).then(()=>{
      shareBtn.textContent='✓ Link copiado!';
      setTimeout(()=>{ shareBtn.innerHTML='🔗 Link'; },2000);
    });
  };
  btnRow.appendChild(shareBtn);

  b.appendChild(btnRow);

  const nd=document.createElement('div');
  nd.className='neg-block';
  nd.innerHTML='<div class="neg-title">Negative Prompt</div>';
  const nt=document.createElement('div');
  nt.textContent=neg;
  nd.appendChild(nt);
  b.appendChild(nd);

  const btnRow2=document.createElement('div');
  btnRow2.className='btn-row';

  const copyNegBtn=document.createElement('button');
  copyNegBtn.className='copy-btn neg';
  copyNegBtn.innerHTML='🚫 Copiar negativo';
  copyNegBtn.onclick=()=>{
    navigator.clipboard.writeText(neg).then(()=>{
      copyNegBtn.textContent='✓ Copiado!'; copyNegBtn.classList.add('ok');
      setTimeout(()=>{ copyNegBtn.innerHTML='🚫 Copiar negativo'; copyNegBtn.classList.remove('ok'); },2000);
    });
  };
  btnRow2.appendChild(copyNegBtn);

  const restBtn=document.createElement('button');
  restBtn.className='icon-btn';
  restBtn.innerHTML='⟳ Novo prompt';
  restBtn.onclick=restart;
  btnRow2.appendChild(restBtn);

  b.appendChild(btnRow2);
  scrollBottom();
  setQR([{label:'⟳ Criar novo prompt',val:'novo'}]);
  qrArea.querySelector('.qr').onclick=restart;
  waiting=false;
}

// ─── Random mode ──────────────────────────────────────────────────────────
async function randomAll(){
  if(waiting) return;
  restart();
  await delay(800);
  for(let i=0;i<STEPS.length;i++){
    const s=STEPS[i];
    if(!s.qr||s.qr.length===0) continue;
    const pool=s.qr.filter(q=>q.val!==''&&!q.skip);
    if(pool.length===0) continue;
    const pick=pool[Math.floor(Math.random()*pool.length)];
    answers[s.id]=pick.val;
  }
  step=STEPS.length;
  updateProgress();
  clearQR();
  addMsg('bot','🎲 <strong>Sorteando tudo aleatoriamente…</strong>');
  await delay(600);
  await showResult();
}

// ─── History panel ────────────────────────────────────────────────────────
function openHistory(){
  const h=loadHistory();
  const list=document.getElementById('hist-list');
  list.innerHTML='';
  if(h.length===0){
    list.innerHTML='<div class="hist-empty">Nenhum prompt gerado ainda.</div>';
  } else {
    h.forEach((item,i)=>{
      const el=document.createElement('div');
      el.className='hist-item';
      const d=new Date(item.ts);
      el.innerHTML=`<small>${d.toLocaleString('pt-BR')}</small>${escHtml(item.prompt.slice(0,180))}…`;
      el.onclick=()=>{
        navigator.clipboard.writeText(item.prompt).catch(()=>{});
        el.style.borderColor='var(--green)';
        setTimeout(()=>{ el.style.borderColor=''; },1200);
      };
      list.appendChild(el);
    });
  }
  document.getElementById('hist-panel').classList.add('open');
}
function closeHistory(){
  document.getElementById('hist-panel').classList.remove('open');
}
document.getElementById('hist-panel').addEventListener('click',function(e){
  if(e.target===this) closeHistory();
});

// ─── URL share restore ────────────────────────────────────────────────────
function restoreFromURL(){
  const p=new URLSearchParams(location.search);
  let found=false;
  STEPS.forEach(s=>{
    const v=p.get(s.id);
    if(v){ answers[s.id]=v; found=true; }
  });
  return found;
}

// ─── Init & restart ───────────────────────────────────────────────────────
function restart(){
  step=0;
  Object.keys(answers).forEach(k=>delete answers[k]);
  chat.innerHTML='';
  clearQR();
  input.value='';
  waiting=false;
  updateProgress();
  init();
}

async function init(){
  step=0;
  Object.keys(answers).forEach(k=>delete answers[k]);
  waiting=false;
  updateProgress();
  const shared=restoreFromURL();
  if(shared){
    step=STEPS.length;
    updateProgress();
    addMsg('bot','🔗 <strong>Prompt carregado do link compartilhado!</strong>');
    await delay(400);
    await showResult();
    return;
  }
  const first=STEPS[0];
  const qrs=[...first.qr];
  qrs.push({label:'🎲 Sortear tudo',val:'__random__',cls:'rand'});
  await botSay(first.ask, qrs);
}

// patch handleQR for special values
const _origHandleQR=handleQR;
function handleQR(val, label){
  if(waiting) return;
  if(val==='__back__'){ addMsg('usr','← Voltar'); goBack(); return; }
  if(val==='__random__'){ randomAll(); return; }
  addMsg('usr', label);
  processAnswer(val);
}

// ─── Theme ────────────────────────────────────────────────────────────────
function toggleTheme(){
  const d=document.documentElement;
  const dark=d.dataset.theme==='dark';
  d.dataset.theme=dark?'light':'dark';
  document.getElementById('tbtn').textContent=dark?'🌙 Escuro':'☀ Claro';
}

init();
</script>
