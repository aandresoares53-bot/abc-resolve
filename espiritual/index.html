<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal das Sombras — Gerador Chat</title>
<meta name="description" content="Gere prompts espirituais para Umbanda, Quimbanda e o mundo afro-brasileiro em formato de conversa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #110A0D;
  --surface: #1C1018;
  --card:    #251520;
  --border:  #3A2030;
  --border-lit: #7A3A50;
  --ember:   #C8320A;
  --gold:    #C9860A;
  --gold-dim:#7A5206;
  --violet:  #7B2FBE;
  --forest:  #1E6B2E;
  --text:    #EDE0D4;
  --muted:   #9A7A6A;
  --dim:     #4A3030;
  --bot-bg:  #1C1018;
  --user-bg: #2A1820;
  --chip-bg: #251520;
  --chip-border: #5A2A3A;
  --chip-hover: #3A1E28;
  --chip-active: #C8320A;
  --radius: 14px;
  --r-chip: 24px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;font-size:16px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}

/* ── Header ── */
header{text-align:center;padding:28px 16px 16px;border-bottom:1px solid var(--border)}
.sigil-wrap{width:44px;height:44px;margin:0 auto 10px;opacity:.85}
header h1{font-family:'Palatino Linotype',Palatino,Georgia,serif;font-size:clamp(1.1rem,4vw,1.6rem);font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--text)}
header h1 span{display:block;font-size:.55em;letter-spacing:.3em;color:var(--gold);margin-bottom:4px}
.header-sub{font-size:.72rem;color:var(--muted);letter-spacing:.08em;margin-top:4px}

/* ── Progress bar ── */
.progress-wrap{padding:10px 16px 0;max-width:700px;margin:0 auto;width:100%}
.progress-bar{height:2px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ember),var(--gold));border-radius:2px;transition:width .4s ease}
.progress-label{font-size:.65rem;color:var(--muted);letter-spacing:.15em;text-align:right;margin-top:4px;text-transform:uppercase}

/* ── Chat window ── */
#chat{flex:1;max-width:700px;width:100%;margin:0 auto;padding:16px 16px 120px;display:flex;flex-direction:column;gap:18px}

/* ── Messages ── */
.msg{display:flex;gap:10px;align-items:flex-start;animation:fadeUp .3s ease}
.msg.bot{flex-direction:row}
.msg.user{flex-direction:row-reverse}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-top:2px}
.bot .avatar{background:var(--surface);border:1px solid var(--border-lit)}
.user .avatar{background:var(--user-bg);border:1px solid var(--dim)}

.bubble{padding:11px 16px;border-radius:var(--radius);font-size:.88rem;line-height:1.55;max-width:88%}
.bot .bubble{background:var(--bot-bg);border:1px solid var(--border);border-top-left-radius:4px;color:var(--text)}
.user .bubble{background:var(--user-bg);border:1px solid var(--dim);border-top-right-radius:4px;color:var(--muted)}

/* ── Chips ── */
.chips-wrap{padding:0 0 0 40px;display:flex;flex-wrap:wrap;gap:10px;animation:fadeUp .3s ease .1s both}
.chip{padding:10px 20px;background:var(--chip-bg);border:1px solid var(--chip-border);border-radius:var(--r-chip);color:var(--text);font-family:Georgia,serif;font-size:.9rem;cursor:pointer;transition:all .18s;white-space:nowrap;outline:none}
.chip:hover{background:var(--chip-hover);border-color:var(--border-lit);color:var(--text)}
.chip.selected{background:var(--ember);border-color:var(--ember);color:#fff}
.chip.skip{border-color:var(--dim);color:var(--muted)}
.chip.skip:hover{border-color:var(--border-lit);color:var(--text)}

/* ── Free input ── */
.free-wrap{padding:0 0 0 40px;display:flex;gap:8px;animation:fadeUp .3s ease .15s both}
.free-wrap input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-chip);padding:9px 16px;color:var(--text);font-family:Georgia,serif;font-size:.85rem;outline:none}
.free-wrap input:focus{border-color:var(--border-lit)}
.free-wrap input::placeholder{color:var(--muted)}
.free-wrap button{padding:9px 18px;background:var(--ember);border:none;border-radius:var(--r-chip);color:#fff;font-family:Georgia,serif;font-size:.82rem;cursor:pointer}

/* ── Typing indicator ── */
.typing{display:flex;align-items:center;gap:5px;padding:12px 16px}
.dot{width:6px;height:6px;background:var(--muted);border-radius:50%;animation:bounce .9s infinite}
.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}

/* ── Result card ── */
.result-card{background:var(--surface);border:1px solid var(--border-lit);border-radius:var(--radius);padding:20px;animation:fadeUp .35s ease}
.result-card h3{font-family:'Palatino Linotype',Georgia,serif;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.result-card .entity-name{font-size:2rem;color:var(--gold);margin-bottom:4px;font-family:'Caveat',cursive;font-weight:700;text-shadow:0 0 12px rgba(201,134,10,.4)}
.result-card .entity-name-sub{font-size:.7rem;color:var(--text);letter-spacing:.22em;text-transform:uppercase;margin-bottom:16px;opacity:.8}
.assinatura{margin-top:16px;padding-top:12px;border-top:1px solid var(--border-lit);text-align:center;font-size:1.1rem;letter-spacing:.1em;color:var(--gold);font-family:'Caveat',cursive;font-style:italic}
/* ── Affinity suggestion chips ── */
.chip.sugg{border-color:var(--gold);color:var(--gold);background:rgba(201,134,10,.08)}
.chip.sugg:hover{background:rgba(201,134,10,.18)}
.prompt-label{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.prompt-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:.8rem;line-height:1.55;color:var(--text);white-space:pre-wrap;word-break:break-word;margin-bottom:14px}
.result-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn-act{padding:8px 16px;border-radius:var(--r-chip);border:1px solid var(--border-lit);background:transparent;color:var(--text);font-family:Georgia,serif;font-size:.78rem;cursor:pointer;transition:all .18s}
.btn-act:hover{background:var(--card);border-color:var(--gold)}
.btn-act.primary{background:var(--ember);border-color:var(--ember);color:#fff}
.btn-act.primary:hover{opacity:.9}
.divider-rune{text-align:center;color:var(--dim);font-size:.8rem;letter-spacing:.3em;margin:4px 0}

/* ── Bottom bar ── */
#bottom-bar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,var(--bg) 30%);padding:20px 16px 20px;display:flex;justify-content:center;gap:10px;z-index:10}
.bar-btn{padding:9px 20px;border-radius:var(--r-chip);border:1px solid var(--border);background:var(--surface);color:var(--muted);font-family:Georgia,serif;font-size:.78rem;cursor:pointer;transition:all .18s}
.bar-btn:hover{border-color:var(--border-lit);color:var(--text)}
.bar-btn.danger{border-color:var(--dim)}
.bar-btn-surprise{border-color:var(--gold-dim);color:var(--gold)}
.bar-btn-surprise:hover{background:var(--gold);color:#000;border-color:var(--gold)}

/* ── Global search ── */
#global-search-wrap{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 16px 6px;border-bottom:1px solid var(--border)}
.gs-inner{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-chip);padding:8px 12px;transition:border-color .18s;max-width:700px;margin:0 auto}
.gs-inner:focus-within{border-color:var(--border-lit)}
.gs-icon{font-size:.9rem;opacity:.6;flex-shrink:0}
#global-search{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:.85rem;font-family:Georgia,serif}
#global-search::placeholder{color:var(--muted)}
#gs-clear{cursor:pointer;opacity:.5;font-size:.75rem;flex-shrink:0;padding:2px 4px}
#gs-clear:hover{opacity:1}
#gs-results{max-width:700px;margin:6px auto 0;display:flex;flex-direction:column;gap:4px;max-height:60vh;overflow-y:auto}
.gs-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:border-color .15s,background .15s}
.gs-item:hover{border-color:var(--border-lit);background:color-mix(in srgb,var(--ember) 8%,transparent)}
.gs-item-icon{font-size:1.3rem;flex-shrink:0}
.gs-item-info{min-width:0}
.gs-item-name{font-size:.85rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-item-desc{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-item-cat{font-size:.65rem;color:var(--gold);opacity:.7;text-transform:uppercase;letter-spacing:.04em}
.gs-empty{text-align:center;color:var(--muted);font-size:.8rem;padding:16px}

/* ── Combo chips ── */
.chip-combo{border-color:var(--gold-dim)!important;color:var(--gold)!important;font-weight:600}
.chip-combo:hover{background:color-mix(in srgb,var(--gold) 15%,transparent)!important;border-color:var(--gold)!important}

/* ── History panel ── */
#hist-panel{position:fixed;inset:0;background:rgba(10,5,8,.92);z-index:50;display:none;flex-direction:column}
#hist-panel.open{display:flex}
.hist-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.hist-header h2{font-family:'Palatino Linotype',Georgia,serif;font-size:1rem;letter-spacing:.15em;text-transform:uppercase;font-weight:400;color:var(--gold)}
.hist-close{background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;padding:4px 8px}
#hist-list{flex:1;overflow-y:auto;padding:16px}
.hist-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;cursor:pointer;transition:border-color .2s}
.hist-item:hover{border-color:var(--border-lit)}
.hist-item-name{font-size:.85rem;color:var(--text);margin-bottom:4px}
.hist-item-meta{font-size:.65rem;color:var(--muted);letter-spacing:.1em}
.hist-item-preview{font-size:.72rem;color:var(--dim);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-empty{text-align:center;color:var(--muted);font-size:.82rem;padding:40px 0}

/* ── Loading ── */
#loading{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.load-sigil{font-size:2.5rem;animation:spin 3s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.load-text{font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

/* ── Mobile ── */
@media(max-width:480px){
  .bubble{font-size:.85rem}
  .chip{font-size:.82rem;padding:9px 16px}
  header h1{font-size:1rem}
}
</style>
</head>
<body>

<!-- Loading screen -->
<div id="loading">
  <div class="load-sigil">⛧</div>
  <div class="load-text">Invocando entidades...</div>
</div>

<header>
  <div class="sigil-wrap">
    <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="22" cy="22" r="20" stroke="#C9860A" stroke-width="1.2"/>
      <polygon points="22,4 40,36 4,36" fill="none" stroke="#C8320A" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="22" cy="22" r="4" fill="#C9860A" opacity=".8"/>
    </svg>
  </div>
  <h1><span>Portal das Sombras</span>Gerador Espiritual</h1>
  <div class="header-sub">Prompts para Umbanda · Quimbanda · Espiritualidade</div>
</header>

<div id="global-search-wrap">
  <div class="gs-inner">
    <span class="gs-icon">🔍</span>
    <input id="global-search" type="text" placeholder="Buscar entidade… (Exu, Iemanjá, Pombagira…)" autocomplete="off" oninput="onGlobalSearch(this.value)" />
    <span id="gs-clear" onclick="clearGlobalSearch()" style="display:none">✕</span>
  </div>
  <div id="gs-results" style="display:none"></div>
</div>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
  <div class="progress-label" id="prog-label">Etapa 1 de 6</div>
</div>

<div id="chat"></div>

<div id="bottom-bar">
  <button class="bar-btn" onclick="openHist()">📜 Histórico</button>
  <button class="bar-btn bar-btn-surprise" onclick="surpresaFlow()">🎲 Surpreenda-me</button>
  <button class="bar-btn danger" onclick="restartFlow()">↺ Recomeçar</button>
</div>

<!-- History panel -->
<div id="hist-panel">
  <div class="hist-header">
    <h2>⛧ Histórico</h2>
    <button class="hist-close" onclick="closeHist()">✕</button>
  </div>
  <div id="hist-list"></div>
</div>

<script>
// ── Entity data store ──────────────────────────────────────────────────
const BASE_URL = 'https://raw.githubusercontent.com/aandresoares53-bot/abc-resolve/claude/vercel-list-projects-acsxdg/promptespiritual-data';
const CATS = ["orixa","exu","pombo","bruxa","demonio","egungun","eguns","malandro","baiano","preto","boiadeiro","ere","caboclo","cigano"];
const CAT_LABELS = {
  orixa:'Orixá', exu:'Exu', pombo:'Pomba-Gira', bruxa:'Bruxa / Feiticeira',
  demonio:'Demônio', egungun:'Egungun', eguns:'Egum', malandro:'Malandro',
  baiano:'Baiano', preto:'Preto-Velho', boiadeiro:'Boiadeiro', ere:'Erê',
  caboclo:'Caboclo', cigano:'Cigano'
};
const CAT_ICONS = {
  orixa:'🌊', exu:'🔥', pombo:'🌹', bruxa:'🌙', demonio:'⛧', egungun:'💀',
  eguns:'👁', malandro:'🎩', baiano:'🌺', preto:'🕯', boiadeiro:'🌾',
  ere:'⭐', caboclo:'🏹', cigano:'🔮'
};
let ENTITIES = {};
let answers = {};
let currentStep = 0;
let currentEntity = null;
let generatedEN = '';
let generatedPT = '';
let generatedDalle = '';
let activeTags = new Set();

// ── Steps definition ───────────────────────────────────────────────────
const STEPS = [
  {
    id: 'categoria',
    label: 'Categoria',
    ask: 'Qual categoria de entidade espiritual você quer invocar?',
    qr: Object.entries(CAT_LABELS).map(([val,label]) => ({label: `${CAT_ICONS[val]} ${label}`, val})),
    dynamic: false, skip: false
  },
  {
    id: 'entidade',
    label: 'Entidade',
    ask: 'Qual entidade específica?',
    qr: [], // populated after categoria chosen
    dynamic: true, skip: false
  },
  {
    id: 'estilo',
    label: 'Estilo',
    ask: 'Qual o estilo artístico da imagem?',
    qr: [
      {label:'📸 Fotorrealismo hiper-detalhado', val:'(photorealistic:1.4), (hyperrealistic:1.3), ultra detailed photograph, 8k uhd, sharp focus, professional studio lighting', tags:['photo','realistic','portrait']},
      {label:'🖥️ Render 3D fotorrealista', val:'(3d render:1.3), (photorealistic:1.4), octane render, cinema 4d, ray tracing, physically based rendering, ultra detailed', tags:['photo','realistic','fantasy']},
      {label:'🎨 Pintura digital hiper-realista', val:'(digital painting:1.2), (hyperrealistic:1.3), detailed digital art, artstation, concept art, sharp details', tags:['painting','realistic','fantasy','dark']},
      {label:'📷 Fotografia analógica', val:'analog photography, film grain, 35mm film, (photorealistic:1.2), cinematic', tags:['photo','realistic','dark']},
      {label:'📸 Foto de estúdio profissional', val:'(professional studio photography:1.3), (photorealistic:1.4), dramatic lighting, high resolution, ultra sharp', tags:['photo','realistic','portrait','sacred']},
      {label:'🎨 Pintura a óleo clássica', val:'oil painting, thick impasto brushwork, classical technique, old masters style', tags:['painting','classic','sacred']},
      {label:'⚙️ Gravura em metal', val:'etching engraving, intaglio printmaking, black and white', tags:['dark','occult','classic']},
      {label:'💧 Aquarela', val:'watercolor painting, transparent washes, soft edges', tags:['soft','mystic','nature']},
      {label:'🖥️ Arte digital conceitual', val:'digital concept art, detailed matte painting, artstation trending', tags:['dark','fantasy','mystic']},
      {label:'📖 Iluminura medieval', val:'medieval illuminated manuscript, gold leaf ornate borders', tags:['sacred','classic','gold']},
      {label:'🪵 Xilogravura', val:'woodblock print, bold graphic lines, high contrast', tags:['dark','occult','bold']},
      {label:'✝️ Arte sacra barroca', val:'baroque religious art, dramatic chiaroscuro, gilded frame', tags:['sacred','gold','classic','light']},

      {label:'🌊 Arte visceral expressionista', val:'expressionist painting, raw emotional intensity, distorted forms, bold brushwork', tags:['dark','horror','bold','infernal']},
      {label:'⚡ Cyberpunk ocultista', val:'cyberpunk aesthetic, neon occult, futuristic dark art, digital glitch effects', tags:['dark','fantasy','bold','mystic']},
    ],
    dynamic: false, skip: false
  },
  {
    id: 'composicao',
    label: 'Composição',
    ask: 'Como deve ser a composição da imagem?',
    qr: [
      {label:'👤 Retrato ultra-fechado', val:'extreme close-up portrait, face only, sharp focus, every detail visible', tags:['portrait','photo','realistic']},
      {label:'👤 Retrato fechado', val:'close-up portrait, face and shoulders', tags:['portrait','photo','realistic']},
      {label:'🧍 Meio corpo', val:'half body shot, waist up', tags:['portrait','classic']},
      {label:'🧍‍♀️ Corpo inteiro', val:'full body standing figure', tags:['sacred','majestic','nature']},
      {label:'🔭 Vista de baixo dramática', val:'dramatic low angle view, looking up at figure, foreshortening, imposing perspective', tags:['majestic','dark','bold']},
      {label:'👁️ Vista de cima', val:'high angle view, looking down', tags:['mystic','dream','occult']},
      {label:'🌑 Silhueta dramática', val:'dramatic silhouette against glowing background', tags:['dark','occult','infernal','bold']},
      {label:'🌅 Cena panorâmica épica', val:'epic wide establishing shot, figure in vast dramatic environment', tags:['nature','sacred','fantasy','majestic']},
      {label:'🪞 Composição simétrica', val:'symmetrical composition, centered figure, perfect balance', tags:['sacred','gold','majestic','classic']},

    ],
    dynamic: false, skip: false
  },
  {
    id: 'luz',
    label: 'Iluminação',
    ask: 'Qual o tipo de iluminação?',
    qr: [
      {label:'🕯️ Velas e fogueira', val:'candlelight and bonfire glow, warm flickering orange light, chiaroscuro', tags:['occult','sacred','ritual','infernal']},
      {label:'🌕 Lua cheia', val:'full moonlight, cool silver lunar glow, night scene, moonbeams', tags:['mystic','dark','nature','dream']},

      {label:'🔵 Bioluminescência espectral', val:'bioluminescent supernatural glow, blue-green spectral light, spirit fire', tags:['mystic','dream','nature','fantasy']},
      {label:'🔴 Luz infernal abissal', val:'hellfire red glow, demonic underworld light, lava reflection', tags:['infernal','dark','horror','occult']},
      {label:'🌅 Crepúsculo dourado', val:'twilight golden hour, dusk sunset orange sky, warm golden light', tags:['gold','nature','mystic','soft']},
      {label:'🎭 Iluminação de estúdio', val:'professional studio lighting, three point lighting setup, dramatic shadows, high contrast', tags:['photo','realistic','portrait','bold']},
      {label:'🌈 Luz de vitrô sacro', val:'stained glass colored light, multicolored beams, cathedral illumination', tags:['sacred','gold','classic','mystic']},
      {label:'🔮 Aura e energia pulsante', val:'pulsating aura energy glow around figure, ethereal energy field, supernatural radiance', tags:['mystic','occult','fantasy','majestic']},
      {label:'🌙 Noite estrelada', val:'starry night sky illumination, nebula light, cosmic glow, night atmosphere', tags:['dark','mystic','dream','nature']},
    ],
    dynamic: false, skip: false
  },
  {
    id: 'atmosfera',
    label: 'Atmosfera',
    ask: 'Qual a atmosfera e o mood da imagem?',

// ── Affinity / suggestion system ──────────────────────────────────────
function extractTags(opt) {
  if (opt && opt.tags) opt.tags.forEach(t => activeTags.add(t));
}

function scoreOption(opt) {
  if (!opt.tags || !activeTags.size) return 0;
  return opt.tags.filter(t => activeTags.has(t)).length;
}

function withSuggestions(opts) {
  if (!activeTags.size) return opts;
  const scored = opts.map(o => ({ o, s: scoreOption(o) }));
  const sugg = scored.filter(x => x.s > 0).sort((a,b) => b.s - a.s);
  const rest  = scored.filter(x => x.s === 0);
  return [
    ...sugg.map(x => ({ ...x.o, label: '✦ ' + x.o.label, _sugg: true })),
    ...rest.map(x => x.o)
  ];
}

const HIST_KEY = 'espiritual_hist';

function getHistory() {
  try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch { return []; }
}

function saveHistory(h) {
  try { localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0,20))); } catch {}
}

function addToHistory(name, en, pt) {
  const h = getHistory();
  h.unshift({ ts: Date.now(), name, en, pt });
  saveHistory(h);
}

// ── Progress ───────────────────────────────────────────────────────────
function updateProgress() {
  const total = STEPS.length;
  const pct = Math.round((currentStep / total) * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `Etapa ${currentStep + 1} de ${total}`;
}

// ── Step engine ────────────────────────────────────────────────────────
function showStep(idx) {
  if (idx >= STEPS.length) { showResult(); return; }
  currentStep = idx;
  updateProgress();

  const step = STEPS[idx];
  let options = step.qr;

  // Dynamic: populate entity options from loaded data
  if (step.id === 'entidade') {
    const cat = answers.categoria;
    const list = ENTITIES[cat] || [];
    options = list.map(e => ({ label: e.name, val: e.name }));
    if (!options.length) {
      // skip if no entities loaded
      answers.entidade = 'entidade espiritual';
      currentEntity = null;
      showStep(idx + 1);
      return;
    }
  }

  // Apply affinity suggestions for non-structural steps
  if (step.id !== 'categoria' && step.id !== 'entidade') {
    options = withSuggestions(options);
  }

  const typing = showTyping();
  setTimeout(() => {
    removeTyping();
    appendBotMsg(step.ask);

    const wrap = document.createElement('div');
    wrap.className = 'chips-wrap';
    wrap.id = `chips-${idx}`;

    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'chip' + (opt.val === '__skip__' ? ' skip' : '') + (opt._sugg ? ' sugg' : '');
      btn.textContent = opt.label;
      btn.onclick = () => pickOption(idx, opt.label, opt.val, wrap, opt);
      wrap.appendChild(btn);
    });

    // Free text for entidade
    if (step.id === 'entidade' || step.free) {
      const fw = document.createElement('div');
      fw.className = 'free-wrap';
      fw.innerHTML = `<input type="text" placeholder="Digitar nome da entidade..." id="free-${idx}"><button onclick="submitFree(${idx})">→</button>`;
      chat.appendChild(wrap);
      chat.appendChild(fw);
      document.getElementById(`free-${idx}`).addEventListener('keydown', e => {
        if (e.key === 'Enter') submitFree(idx);
      });
    } else {
      chat.appendChild(wrap);
    }
    scrollBot();
  }, 500);
}

function submitFree(idx) {
  const input = document.getElementById(`free-${idx}`);
  const val = input.value.trim();
  if (!val) return;
  pickOption(idx, val, val, document.getElementById(`chips-${idx}`));
}

function pickOption(idx, label, val, chipsEl, opt) {
  // Disable all chips
  if (chipsEl) chipsEl.querySelectorAll('.chip').forEach(c => {
    c.disabled = true;
    c.style.opacity = '0.4';
  });
  // Disable free input
  const fw = chipsEl && chipsEl.nextSibling;
  if (fw && fw.classList && fw.classList.contains('free-wrap')) {
    fw.querySelectorAll('input,button').forEach(e => e.disabled = true);
  }

  const step = STEPS[idx];

  if (val === '__skip__') {
    answers[step.id] = '';
    appendUserMsg('— Pular —');
  } else {
    answers[step.id] = val;
    // Strip suggestion prefix for user message
    appendUserMsg(label.replace(/^✦ /, ''));

    // Extract tags for affinity system
    if (opt) extractTags(opt);

    // Set currentEntity when entidade chosen
    if (step.id === 'entidade') {
      const cat = answers.categoria;
      currentEntity = (ENTITIES[cat] || []).find(e => e.name === val) || { name: val };
    }
  }

  if (step.id === 'entidade' && val !== '__skip__') {
    setTimeout(() => showComboStep(), 300);
  } else {
    setTimeout(() => showStep(idx + 1), 300);
  }
}

// ── DALL-E 3 sanitizer ─────────────────────────────────────────────────
function cleanForDALLE(text) {
  if (!text) return '';
  let t = text;

  // Strip SD weight syntax (word:1.4) → word
  t = t.replace(/\(([^()]+):\d+(?:\.\d+)?\)/g, '$1');

  // Explicit sexual acts
  t = t.replace(/\bblowjob\b[^,]*/gi, '');
  t = t.replace(/\bpenetrat\w+[^,]*/gi, '');
  t = t.replace(/\borgasm\b[^,]*/gi, '');
  t = t.replace(/\bmasturbat\w+[^,]*/gi, '');
  t = t.replace(/\bporn\w*/gi, '');
  t = t.replace(/\berotic\b/gi, 'sensual artistic');
  t = t.replace(/\bexplicit\b/gi, '');
  t = t.replace(/\bnsfw\b/gi, '');
  t = t.replace(/\bsexual\b/gi, '');

  // Nudity terms → artistic equivalents
  t = t.replace(/\bfully\s+nude\b/gi, 'figure study');
  t = t.replace(/\bnaked\b/gi, 'undraped figure');
  t = t.replace(/\bnudity\b/gi, 'figurative art');
  t = t.replace(/\bnude\b/gi, 'figurative');
  t = t.replace(/\btopless\b/gi, 'bare-shouldered');

  // Genitalia
  t = t.replace(/\bvulva\b[^,]*/gi, '');
  t = t.replace(/\bvagina\b[^,]*/gi, '');
  t = t.replace(/\bpenis\b[^,]*/gi, '');
  t = t.replace(/\bgenitali[^,]*/gi, '');
  t = t.replace(/\bcrotch\b[^,]*/gi, '');

  // Body — semantically blocked
  t = t.replace(/\b(large|big|huge|perky|round|bare)\s+breasts?\b[^,]*/gi, 'natural figure');
  t = t.replace(/\bbreasts?\b[^,]*/gi, 'chest');
  t = t.replace(/\bnipple\w*[^,]*/gi, '');

  // Demonic / horror terms → dark fantasy equivalents
  t = t.replace(/\bsatanic\b/gi, 'occult');
  t = t.replace(/\bsatan\b/gi, 'dark deity');
  t = t.replace(/\blucifer\b/gi, 'fallen angel');
  t = t.replace(/\bdemonic\b/gi, 'dark mythological');
  t = t.replace(/\binfernal\b/gi, 'underworld');
  t = t.replace(/\bhellish\b/gi, 'dark fantasy');
  t = t.replace(/\bgore\b[^,]*/gi, '');
  t = t.replace(/\bgory\b[^,]*/gi, '');
  t = t.replace(/\bmutilat\w+[^,]*/gi, '');
  t = t.replace(/\bdecapitat\w+[^,]*/gi, '');
  t = t.replace(/\bcannibal\w*[^,]*/gi, '');
  t = t.replace(/\btorture\b[^,]*/gi, '');

  // Strip SD tokens that DALL-E ignores / flags
  t = t.replace(/--ar\s+[\d:]+/gi, '');
  t = t.replace(/--artes-espirituais/gi, '');
  t = t.replace(/\bphysically based rendering\b/gi, 'photorealistic rendering');

  // Cleanup artifacts
  t = t.replace(/,(\s*,)+/g, ',').replace(/\s{2,}/g, ' ').trim();
  t = t.replace(/^[,\s]+|[,\s]+$/g, '');
  return t;
}

function buildPromptDalle() {
  const ent = currentEntity || {};
  const name = ent.name_en || ent.name || answers.entidade || 'spiritual entity';
  const nameSafe = name.replace(/[(),]/g, '');
  const parts = [];

  // Natural language lead for DALL-E 3
  const catLabel = (CAT_LABELS[answers.categoria] || answers.categoria || 'spiritual entity').toLowerCase();
  parts.push(`Artistic illustration of ${nameSafe}, a ${catLabel} from Afro-Brazilian spiritual tradition.`);
  if (ent.desc_en) parts.push(ent.desc_en);
  else if (ent.desc) parts.push(ent.desc);

  // Visual choices — sanitized
  if (answers.estilo)     parts.push(cleanForDALLE(answers.estilo));
  if (answers.composicao) parts.push(cleanForDALLE(answers.composicao));
  if (answers.luz)        parts.push(cleanForDALLE(answers.luz));
  if (answers.atmosfera)  parts.push(cleanForDALLE(answers.atmosfera));
  if (answers.extra)      parts.push(cleanForDALLE(answers.extra));
  if (ent.local_en)       parts.push(`Set in ${ent.local_en}.`);

  parts.push('highly detailed, masterpiece quality, fine art');
  return parts.filter(Boolean).join(' ');
}

// ── Prompt builder ─────────────────────────────────────────────────────
function buildPromptEN() {
  const ent = currentEntity || {};
  const parts = [];

  // Entity name — weighted so the model prioritizes rendering it
  const name = ent.name_en || ent.name || answers.entidade || 'spiritual entity';
  const nameSafe = name.replace(/[(),]/g, '');
  parts.push(`(${nameSafe}:1.5)`);
  if (ent.desc_en) parts.push(ent.desc_en);
  else if (ent.desc) parts.push(ent.desc);
  // Text overlay instruction so the name appears written in the image
  parts.push(`ornate calligraphic text inscription "${nameSafe}" visible in image`, `elegant gothic lettering "Artes Espirituais" as signature`);

  // Visual choices
  if (answers.estilo)     parts.push(answers.estilo);
  if (answers.composicao) parts.push(answers.composicao);
  if (answers.luz)        parts.push(answers.luz);
  if (answers.atmosfera)  parts.push(answers.atmosfera);
  if (answers.extra)      parts.push(answers.extra);

  // Location from entity data
  if (ent.local_en) parts.push(`set in ${ent.local_en}`);

  // Add quality tokens — boost if a realism style was chosen
  const isRealism = answers.estilo && (answers.estilo.includes('photorealistic') || answers.estilo.includes('hyperrealistic') || answers.estilo.includes('3d render') || answers.estilo.includes('studio photography'));
  if (isRealism) {
    parts.push('(masterpiece:1.4)', '(best quality:1.3)', '(highly detailed:1.3)', '(8k uhd:1.2)', '(sharp focus:1.2)', 'professional photography');
  } else {
    parts.push('highly detailed', 'masterpiece quality', 'intricate details');
  }
  parts.push('--ar 9:16', '--artes-espirituais');
  return parts.filter(Boolean).join(', ');
}

function buildPromptPT() {

function showComboStep() {
  const cat = answers.categoria;
  const combos = COMBOS_BY_CAT[cat] || COMBOS_DEFAULT;
  showTyping();
  setTimeout(() => {
    removeTyping();
    appendBotMsg('✨ Combinações de estilo recomendadas para esta entidade:');
    const comboWrap = document.createElement('div');
    comboWrap.className = 'chips-wrap combo-chips';

    let manualSection = null;

    combos.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'chip chip-combo';
      btn.textContent = c.label;
      btn.onclick = () => {
        disableChipsEl(comboWrap);
        answers.estilo = c.e;
        answers.composicao = c.c;
        answers.luz = c.l;
        answers.atmosfera = c.a;
        appendUserMsg(c.label);
        setTimeout(() => showStep(STEPS.findIndex(s => s.id === 'extra')), 300);
      };
      comboWrap.appendChild(btn);
    });

    const skipBtn = document.createElement('button');
    skipBtn.className = 'chip skip';
    skipBtn.textContent = '— Escolher manualmente —';
    skipBtn.onclick = () => {
      disableChipsEl(comboWrap);
      manualSection.style.display = '';
      window.scrollTo(0, document.body.scrollHeight);
    };
    comboWrap.appendChild(skipBtn);
    chat.appendChild(comboWrap);

    // Manual section hidden initially
    manualSection = document.createElement('div');
    manualSection.style.display = 'none';
    chat.appendChild(manualSection);

    // Show steps 2,3,4,5 (estilo,composicao,luz,atmosfera) sequentially
    function showManualStep(stepIdx, container) {
      if (stepIdx > STEPS.findIndex(s => s.id === 'atmosfera')) {
        setTimeout(() => showStep(STEPS.findIndex(s => s.id === 'extra')), 300);
        return;
      }
      const step = STEPS[stepIdx];
      const opts = withSuggestions(step.qr);
      const lbl = document.createElement('div');
      lbl.className = 'msg bot';
      lbl.innerHTML = `<div class="avatar">⛧</div><div class="bubble">${step.ask}</div>`;
      container.appendChild(lbl);
      const wrap = document.createElement('div');
      wrap.className = 'chips-wrap';
      opts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'chip' + (opt._sugg ? ' sugg' : '');
        btn.textContent = opt.label;
        btn.onclick = () => {
          disableChipsEl(wrap);
          answers[step.id] = opt.val;
          appendUserMsg(opt.label.replace(/^✦ /,''));
          if (opt.tags) opt.tags.forEach(t => activeTags.add(t));
          showManualStep(stepIdx + 1, container);
        };
        wrap.appendChild(btn);
      });
      container.appendChild(wrap);
      window.scrollTo(0, document.body.scrollHeight);
    }
    showManualStep(STEPS.findIndex(s => s.id === 'estilo'), manualSection);

    scrollBot();
  }, 400);
}

function disableChipsEl(wrap) {
  wrap.querySelectorAll('.chip').forEach(c => { c.disabled = true; c.style.opacity = '0.4'; });
}

// ── Global search ───────────────────────────────────────────────────────
let gsTimer = null;
function onGlobalSearch(val) {
  document.getElementById('gs-clear').style.display = val ? '' : 'none';
  clearTimeout(gsTimer);
  gsTimer = setTimeout(() => renderGsResults(val), 200);
}
function clearGlobalSearch() {
  document.getElementById('global-search').value = '';
  document.getElementById('gs-clear').style.display = 'none';
  document.getElementById('gs-results').style.display = 'none';
}
function renderGsResults(query) {
  const box = document.getElementById('gs-results');
  const q = query.trim().toLowerCase();
  if (!q) { box.style.display = 'none'; return; }
  const words = q.split(/\s+/);
  const matches = [];
  Object.entries(ENTITIES).forEach(([cat, list]) => {
    list.forEach(ent => {
      const hay = [ent.name, ent.name_en, ent.desc, ent.desc_en, cat]
        .filter(Boolean).join(' ').toLowerCase();
      if (words.every(w => hay.includes(w))) {
        matches.push({ ...ent, _cat: cat });
      }
    });
  });
  box.innerHTML = '';
  if (!matches.length) {
    box.innerHTML = `<div class="gs-empty">Nenhuma entidade encontrada para "${q}"</div>`;
  } else {
    matches.slice(0, 20).forEach(ent => {
      const el = document.createElement('div');
      el.className = 'gs-item';
      const icon = CAT_ICONS[ent._cat] || '⛧';
      const catLabel = CAT_LABELS[ent._cat] || ent._cat;
      el.innerHTML = `<div class="gs-item-icon">${icon}</div><div class="gs-item-info"><div class="gs-item-name">${ent.name}</div><div class="gs-item-desc">${ent.desc || ent.desc_en || ''}</div><div class="gs-item-cat">${catLabel}</div></div>`;
      el.onclick = () => selectGsEntity(ent);
      box.appendChild(el);
    });
  }
  box.style.display = '';
}
function selectGsEntity(ent) {
  clearGlobalSearch();
  answers = {};
  currentEntity = null;
  currentStep = 0;
  activeTags.clear();
  chat.innerHTML = '';
  answers.categoria = ent._cat;
  answers.entidade = ent.name;
  currentEntity = ent;
  appendUserMsg(`${CAT_ICONS[ent._cat] || '⛧'} ${ent.name}`);
  updateProgress();
  setTimeout(() => showComboStep(), 300);
}
document.addEventListener('click', e => {
  if (!document.getElementById('global-search-wrap').contains(e.target))
    document.getElementById('gs-results').style.display = 'none';
});

// ── Surpreenda-me ───────────────────────────────────────────────────────
function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function surpresaFlow() {
  answers = {};
  currentEntity = null;
  currentStep = 0;
  activeTags.clear();
  chat.innerHTML = '';
  updateProgress();

  // Pick random categoria that has entities
  const catsWithEntities = Object.entries(ENTITIES).filter(([,list]) => list.length > 0);
  if (!catsWithEntities.length) { startFlow(); return; }
  const [cat, list] = pickRandom(catsWithEntities);
  const ent = pickRandom(list);
  answers.categoria = cat;
  answers.entidade = ent.name;
  currentEntity = ent;

  // Pick random options for estilo, composicao, luz, atmosfera (skip extra)
  const estiloOpts = STEPS[2].qr.filter(o => o.val !== '__skip__');
  const compOpts   = STEPS[3].qr.filter(o => o.val !== '__skip__');
  const luzOpts    = STEPS[4].qr.filter(o => o.val !== '__skip__');
  const atmOpts    = STEPS[5].qr.filter(o => o.val !== '__skip__');
  answers.estilo     = pickRandom(estiloOpts).val;
  answers.composicao = pickRandom(compOpts).val;
  answers.luz        = pickRandom(luzOpts).val;
  answers.atmosfera  = pickRandom(atmOpts).val;
  answers.extra      = '';

  showTyping();
  setTimeout(() => {
    removeTyping();
    appendBotMsg(`🎲 Sorteado! Invocando <strong>${CAT_ICONS[cat] || '⛧'} ${ent.name}</strong> (${CAT_LABELS[cat]}) com estilo aleatório…`);
    setTimeout(() => showResult(), 600);
  }, 500);
}

// ── Restart ────────────────────────────────────────────────────────────
function restartFlow() {
  answers = {};
  currentEntity = null;
  generatedEN = '';
  generatedPT = '';
  currentStep = 0;
  activeTags.clear();
  chat.innerHTML = '';
  startFlow();
}

// ── Start ──────────────────────────────────────────────────────────────
function startFlow() {
  updateProgress();
  const typing = showTyping();
  setTimeout(() => {
    removeTyping();
    appendBotMsg('Bem-vindo ao Portal das Sombras. Vou guiar você na criação de um prompt espiritual poderoso.');
    setTimeout(() => showStep(0), 600);
  }, 700);
}

// ── Load entities and init ─────────────────────────────────────────────
async function init() {
  try {
    await Promise.all(CATS.map(async cat => {
      try {
        const r = await fetch(`${BASE_URL}/ent-${cat}.json`);
        ENTITIES[cat] = r.ok ? await r.json() : [];
      } catch {
        ENTITIES[cat] = [];
      }
    }));
  } catch(e) {
    console.error('Entity load error:', e);
  }
  document.getElementById('loading').style.display = 'none';
  startFlow();
}

init();
